name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22.15.0
        uses: actions/setup-node@v4
        with:
          node-version: 22.15.0
      - name: Install pnpm
        run: npm i -g pnpm
      - name: Install
        run: pnpm i
      - name: Build
        run: pnpm run docs:build
      - name: Lint
        run: pnpm run lint
      - name: Prepare playwright
        run: pnpm exec playwright install --with-deps
      - name: Test
        run: pnpm run test
        env:
          FORCE_COLOR: 1
      - name: Upload Test Results
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Test Results
          path: dist/tests/results/test-report.xml
  event_file:
    name: 'Event File'
    runs-on: ubuntu-latest
    steps:
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Event File
          path: ${{ github.event_path }}
