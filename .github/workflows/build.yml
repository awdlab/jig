name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    timeout-minutes: 5
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22.22.3
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
      - name: Install pnpm
        run: npm i -g pnpm
      - name: Install
        run: pnpm i
      - name: Format Check
        run: pnpm run format:check
      - name: Lint
        run: pnpm run lint
      - name: Build themes
        run: pnpm run types:build
      - name: Build themes
        run: pnpm run themes:build
      - name: Build controls
        run: pnpm run controls:build
      - name: Unit Tests
        run: pnpm run unit-test
      - name: Build docs
        run: pnpm run docs:build

  playwright:
    name: "Playwright Tests"
    # The suite already ran ~19 min on main and grows with each new control,
    # leaving no headroom under the previous 20 min cap. Raised to 30; consider
    # sharding across runners if it approaches this again.
    timeout-minutes: 30
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.0-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
      - name: Install pnpm
        run: npm i -g pnpm
      - name: Install
        run: pnpm i
      - name: Check for test compiler errors
        run: pnpm run test:build
      - name: Run Tests
        run: pnpm run test
        env:
          FORCE_COLOR: 1
      - name: Upload Test Results
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Test Results
          path: tests/results/test-report.xml

  event_file:
    name: "Event File"
    timeout-minutes: 1
    runs-on: ubuntu-latest
    steps:
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Event File
          path: ${{ github.event_path }}
