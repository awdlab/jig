name: Deploy to awdserver

# The image is built here, not on the server — the root server has too little RAM
# to run the docs build alongside the other apps. CI pushes to GHCR, the SSH step
# only pulls and restarts.

on:
  push:
    branches: ["main"]

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/jig-docs

jobs:
  image:
    runs-on: ubuntu-latest
    # The docs build downloads and quantizes the search model, then embeds the index.
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Single arch — the server is amd64 and multi-arch doubles build time.
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          # Layer cache lives in the Actions cache, so unchanged deps skip reinstall.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    environment: awdserver

    steps:
      - name: Deploy with GITHUB_TOKEN
        uses: appleboy/ssh-action@v1.2.5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          host: ${{ secrets.ADDRESS }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: GITHUB_TOKEN # Forwards to remote — update.ps1 logs in to GHCR with it
          script: |
            cd ${{ secrets.UPDATE_PATH }}
            pwsh update.ps1
