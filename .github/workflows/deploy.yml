name: Deploy to awdserver

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: awdserver

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t rsa "${{ secrets.ADDRESS }}" >> ~/.ssh/known_hosts

      - name: Run remote update script
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.ADDRESS }} << 'EOF'
            cd ${{ secrets.UPDATE_PATH }}
            pwsh update.ps1
          EOF
