@for (c of componentStories(); track $index) {
  @if (c.component; as component) {
    <h2 [id]="c.title">
      <a [routerLink]="'.'" fragment="{{ c.title }}">{{ c.title }}</a>
    </h2>
    <ng-container *ngComponentOutlet="component" />
  }
  <details>
    <summary>Code</summary>
    <pre>{{ c.code }}</pre>
  </details>
  <hr />
}
