<ngn-dialog [modal]="true" [open]="dialogOpen()" (closed)="dialogOpen.set(false)">
  <ngn-select
    [label]="'hi'"
    [options]="options"
    [ngModel]="selectedItem()"
    (ngModelChange)="selectedItem.set($event)"
    #select
  >
  </ngn-select>
</ngn-dialog>

<button (click)="dialogOpen.set(true)">open</button>

<ngn-select
  [label]="'hi'"
  [options]="options"
  [filter]="{
    filterFn: filterFn,
  }"
  [ngModel]="selectedItem()"
  (ngModelChange)="selectedItem.set($event)"
  #select
  [filterIcon]="{
    prefix: 'fa-solid',
    icon: 'fa-magnifying-glass',
  }"
>
</ngn-select>

{{ selectedItem() }}

<ng-template #iconTemplate [ngnTemplate]="iconType" let-icon>
  <div class="bla">
    <i class="{{ icon.prefix }} {{ icon.icon }}"></i>
  </div>
</ng-template>

<div #parent style="height: 200px; width: 200px">
  <ngn-scroller [items]="items" [itemHeight]="30">
    <ng-template #item let-item>
      <div class="item" style="height: 30px">
        <p>{{ item.label }}</p>
      </div>
    </ng-template>
  </ngn-scroller>
</div>

<div style="height: 200px; width: 200px">
  <ngn-list-box [items]="items" [selectable]="true">
    <ng-template #item let-item>
      <div class="item" style="height: 30px">
        <p>{{ item.label }}</p>
      </div>
    </ng-template>
  </ngn-list-box>
</div>
