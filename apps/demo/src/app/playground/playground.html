<ngn-dialog [modal]="true" [open]="dialogOpen()" (closed)="dialogOpen.set(false)">
  <ngn-select
    [label]="'hi'"
    [options]="options"
    fieldValue="id"
    fieldLabel="label"
    [ngModel]="selectedItem()"
    (ngModelChange)="selectedItem.set($event)"
    #select
  >
  </ngn-select>
</ngn-dialog>

<button (click)="dialogOpen.set(true)">open</button>

{{ selectedItem() }}

<ng-template #itemTemplate [ngnTemplate]="iconType" let-icon></ng-template>
