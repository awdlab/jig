<header class="flex h-16 justify-between border-b border-(--ngn-color-surface-200) px-4 text-xl">
  <a [routerLink]="'/'" class="flex h-full items-center gap-2 font-bold">
    <img src="img/logo.png" alt="logo" class="h-10 w-10" />
    ngn-controls
  </a>
  <div class="flex h-full items-center gap-2 text-2xl text-(--ngn-color-surface-800)">
    <button ngnButton [kind]="'icon'" (click)="toggleDarkMode()">
      {{ darkModeEnabled() ? '🌙' : '☀️' }}
    </button>
    <a
      href="https://github.com/NGneers/controls"
      target="_blank"
      aria-label="Project on Github"
      ngnButton
      [kind]="'icon'"
    >
      <ngn-icon size="28px" [icon]="iconGithub" />
    </a>
    <button
      class="hide-when-large"
      ngnButton
      [kind]="'icon'"
      aria-label="Menu Toggle"
      (click)="toggleMenu()"
    >
      <ngn-icon size="28px" [icon]="iconBars" />
    </button>
  </div>
</header>
