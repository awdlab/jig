<header class="h-14 text-xl flex px-4 justify-between">
  <a [routerLink]="'/'" class="font-bold h-full flex items-center gap-2">
    <img src="img/logo.png" alt="logo" class="h-10 w-10" />
    ngn-controls
  </a>
  <div class="h-full flex items-center gap-2 text-gray-800">
    <button ngnButton [kind]="'icon'">☀️</button>
    <a
      href="https://github.com/NGneers/controls"
      target="_blank"
      aria-label="Project on Github"
      ngnButton
      [kind]="'icon'"
    >
      <ngn-icon size="28px" [icon]="'fa-brands fa-github'" />
    </a>
    @if (isCompact()) {
      <button ngnButton [kind]="'icon'" aria-label="Menu Toggle" (click)="toggleMenu()">
        <ngn-icon size="28px" [icon]="'fa-solid fa-bars'" />
      </button>
    }
  </div>
</header>
