<div class="menu-wrapper flex">
  <div
    class="hide-when-compact sticky top-[5.5rem] mt-[5.5rem] mb-4 ml-4 max-h-[calc(100dvh-6.5rem)] shrink-0 self-start overflow-x-hidden overflow-y-auto rounded-(--awd-size-rounded-lg) bg-(--awd-color-surface-50) shadow-(--awd-shadow-md)"
  >
    <ng-container *ngTemplateOutlet="menu" />
  </div>

  <router-outlet />
</div>

<awd-drawer
  class="hide-when-large"
  position="left"
  [open]="isOpen()"
  (openChange)="!$event && isOpen.set(false)"
>
  <div class="flex h-full min-h-0 flex-col">
    <awd-docs-topbar-actions
      class="flex shrink-0 border-b border-(--awd-color-surface-200) px-4 py-3"
    />
    <ng-container *ngTemplateOutlet="menu" />
  </div>
</awd-drawer>

<ng-template #menu>
  <div
    class="flex max-h-full w-64 shrink-0 [scrollbar-gutter:stable] flex-col overflow-y-auto pb-8"
  >
    <!-- Deep passthrough fills the switcher to the sidebar width: `group` reaches
    the nested button-group container, `button` reaches each toggle-button's host
    and inline-grid inner button — see `switcherPt`. -->
    <awd-select-button
      class="m-4"
      orientation="vertical"
      [options]="tabOptions"
      [value]="activeTabTitle()"
      [pt]="switcherPt"
      (valueChange)="onTabChange($event)"
    />

    @for (group of activeTab()?.groups; track group.title) {
      <ng-container *ngTemplateOutlet="menuGroup; context: { $implicit: group }" />
    }
  </div>
</ng-template>

<ng-template #menuGroup [ngnTemplate]="templateTypes.group" let-group>
  <span
    class="px-4 pt-4 pb-2 text-(length:--awd-font-size-xs) font-(--awd-font-weight-bold) tracking-wide text-(--awd-color-surface-500) uppercase"
  >
    {{ group.title }}
  </span>
  <div class="flex flex-col">
    @for (item of group.items; track item.link) {
      <a
        [routerLink]="item.link"
        class="menu-item pr-4 pl-4"
        [class.active-item]="isActiveLink(item.link)"
        (click)="isOpen.set(false)"
      >
        <span class="text-wrapper">
          {{ item.title }}
        </span>
      </a>
    }
  </div>
</ng-template>
