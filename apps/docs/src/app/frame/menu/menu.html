<div class="menu-wrapper flex h-full">
  <div class="hide-when-compact">
    <ng-container *ngTemplateOutlet="menu" />
  </div>

  <router-outlet />
</div>

<div class="hide-when-large">
  <!-- todo: sidepanel -->
</div>

<ng-template #menu>
  <div class="flex flex-col w-64 shrink-0 overflow-y-auto max-h-full pb-8">
    @for (item of menuItems; track $index) {
      @if (item.children) {
        <ng-container *ngTemplateOutlet="menuCategory; context: { $implicit: item, level: 0 }" />
      } @else {
        <ng-container *ngTemplateOutlet="menuItem; context: { $implicit: item, level: 0 }" />
      }
    }
  </div>
</ng-template>

<ng-template #menuItem [ngnTemplate]="templateTypes.item" let-item let-level="level">
  <a
    [routerLink]="item.link"
    class="menu-item pr-4"
    [class.active-item]="item === activeMenuItem()"
    [style.paddingLeft.rem]="0.5 + level"
  >
    <span class="text-wrapper">
      {{ item.title }}
    </span>
  </a>
</ng-template>

<ng-template #menuCategory [ngnTemplate]="templateTypes.item" let-item let-level="level">
  <a [routerLink]="item.link" class="px-4 py-2">
    {{ item.title }}
  </a>
  <div class="flex flex-col">
    @for (child of item.children; track $index) {
      <ng-container *ngTemplateOutlet="menuItem; context: { $implicit: child, level: level + 1 }" />
    }
  </div>
</ng-template>
