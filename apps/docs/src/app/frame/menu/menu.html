<div class="menu-wrapper flex h-full">
  <div
    class="hide-when-compact mt-[5.5rem] mb-4 ml-4 h-[calc(100dvh-6.5rem)] shrink-0 self-start overflow-x-hidden overflow-y-auto rounded-(--ngn-size-rounded-lg) bg-(--ngn-color-surface-50) shadow-(--ngn-shadow-md)"
  >
    <ng-container *ngTemplateOutlet="menu" />
  </div>

  <router-outlet />
</div>

<ngn-drawer
  class="hide-when-large"
  position="left"
  [open]="isOpen()"
  (openChange)="!$event && isOpen.set(false)"
>
  <ng-container *ngTemplateOutlet="menu" />
</ngn-drawer>

<ng-template #menu>
  <div class="flex max-h-full w-64 shrink-0 flex-col overflow-y-auto pb-8">
    <!-- TODO: make this switcher fill the sidebar width instead of hugging its
    widest label. Blocked: the fit-content lives in the nested button-group's
    vertical container + the inline-grid inner button, neither of which
    select-button exposes as a passthrough scope. Fix via [pt] once nested pt
    (forwarding into child controls' scopes) is supported. -->
    <ngn-select-button
      class="m-4"
      orientation="vertical"
      [options]="tabOptions"
      [value]="activeTabTitle()"
      (valueChange)="onTabChange($event)"
    />

    @for (group of activeTab()?.groups; track group.title) {
      <ng-container *ngTemplateOutlet="menuGroup; context: { $implicit: group }" />
    }
  </div>
</ng-template>

<ng-template #menuGroup [ngnTemplate]="templateTypes.group" let-group>
  <span
    class="px-4 pt-4 pb-2 text-(length:--ngn-font-size-xs) font-(--ngn-font-weight-bold) tracking-wide text-(--ngn-color-surface-500) uppercase"
  >
    {{ group.title }}
  </span>
  <div class="flex flex-col">
    @for (item of group.items; track item.link) {
      <a
        [routerLink]="item.link"
        class="menu-item pr-4 pl-4"
        [class.active-item]="item.link === activeLink()"
        (click)="isOpen.set(false)"
      >
        <span class="text-wrapper">
          {{ item.title }}
        </span>
      </a>
    }
  </div>
</ng-template>
