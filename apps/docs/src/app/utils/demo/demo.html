<div class="playground flex flex-col w-full">
  <div
    class="component-wrapper p-4 flex gap-2 w-full min-h-fit h-[200px] justify-center items-center"
  >
    <ng-container *ngComponentOutlet="component()" />
  </div>
  <div
    class="w-full bg-(--ngn-color-surface-100) border-t border-(--ngn-color-surface-200) flex justify-end p-2"
  >
    <button ngnButton [kind]="'icon'" (click)="toggleCodeVisibility()">
      <ngn-icon [icon]="'img/icons/code.svg'" />
    </button>
  </div>

  <div class="w-full">
    @if (codeVisible()) {
      <div class="bg-[#1f1f1f] text-white max-h-100 p-4 overflow-auto relative">
        <pre><code class="pi-0 prism" [innerHtml]="formattedCode()"></code></pre>
        <button ngnButton [kind]="'icon'" class="absolute top-1 right-4" (click)="copyCode()">
          <ngn-icon [icon]="'img/icons/copy.svg'" />
        </button>
      </div>
    }
  </div>
</div>
