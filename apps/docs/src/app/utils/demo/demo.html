<div class="playground flex w-full flex-col overflow-hidden">
  <div
    class="component-wrapper flex h-fit w-full items-center justify-center gap-2 p-8 md:min-h-[200px]"
  >
    @defer (on viewport; on idle) {
      <ng-container *ngComponentOutlet="component()" />
    } @placeholder {
      <div class="h-8">
        <jig-spinner [size]="64" [centered]="true" />
      </div>
    }
  </div>
  <div
    class="flex w-full justify-end border-t border-(--jig-color-surface-200) bg-(--jig-color-surface-100) p-2"
  >
    <button jigButton kind="icon" (click)="toggleCodeVisibility()">
      <jig-icon [icon]="iconCode" />
    </button>
  </div>

  <div class="w-full">
    @if (codeVisible()) {
      <div
        class="relative max-h-100 overflow-auto border-t border-[var(--prism-border)] bg-[var(--prism-bg)] p-4 text-[var(--prism-fg)]"
      >
        <pre><code class="pi-0 prism" [innerHtml]="formattedCode()"></code></pre>
        <button jigButton kind="icon" class="absolute end-4 top-1" (click)="copyCode()">
          <jig-icon [icon]="iconCopy" />
        </button>
      </div>
    }
  </div>
</div>
