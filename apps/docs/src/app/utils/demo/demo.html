<div class="playground flex w-full flex-col">
  <div
    class="component-wrapper flex h-fit w-full items-center justify-center gap-2 p-8 md:min-h-[200px]"
  >
    <ng-container *ngComponentOutlet="component()" />
  </div>
  <div
    class="flex w-full justify-end border-t border-(--ngn-color-surface-200) bg-(--ngn-color-surface-100) p-2"
  >
    <button ngnButton kind="icon" (click)="toggleCodeVisibility()">
      <ngn-icon [icon]="iconCode" />
    </button>
  </div>

  <div class="w-full">
    @if (codeVisible()) {
      <div class="relative max-h-100 overflow-auto bg-[#1f1f1f] p-4 text-white">
        <pre><code class="pi-0 prism" [innerHtml]="formattedCode()"></code></pre>
        <button ngnButton kind="icon" class="absolute top-1 right-4" (click)="copyCode()">
          <ngn-icon [icon]="iconCopy" />
        </button>
      </div>
    }
  </div>
</div>
