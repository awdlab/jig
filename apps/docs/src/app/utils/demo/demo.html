<div class="demo-wrapper flex flex-col w-full">
  <div class="component-wrapper p-4 flex gap-2 items-start w-full">
    <ng-container *ngComponentOutlet="component()" />

    <button ngnButton [kind]="'icon'" (click)="toggleCodeVisibility()">
      <ngn-icon [size]="'1rem'" [icon]="'fa-solid fa-code'" />
    </button>
  </div>

  <div class="w-full relative">
    @if (codeVisible()) {
      <pre
        class="bg-gray-100 max-h-100 p-4 overflow-auto"
      ><code class="pi-0 " [innerHtml]="formattedCode()"></code></pre>
      <button ngnButton [kind]="'icon'" class="absolute top-1 right-4" (click)="copyCode()">
        <ngn-icon [size]="'1rem'" [icon]="'fa-solid fa-copy'" />
      </button>
    }
  </div>
</div>
