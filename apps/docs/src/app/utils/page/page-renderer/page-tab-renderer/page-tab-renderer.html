<div class="w-full flex flex-col justify-center">
  <ngn-breadcrumb [items]="breadcrumbItems()" />
  <h2 class="text-3xl m-0 py-6">{{ page.title }}</h2>
</div>

<ngn-tabs
  class="h-full min-h-0"
  [lazy]="true"
  [cache]="true"
  [activeTab]="activeTab()"
  (activeTabChange)="activeTab.set($event)"
  [pt]="tabPt"
>
  @for (tab of page.tabs; track $index) {
    <ngn-tab [tabId]="tab.title">
      <ng-template #header> {{ tab.title }} </ng-template>
      <ng-template #content>
        @switch (tab.kind) {
          @case ('single') {
            <ngn-docs-section [section]="tab" />
          }
          @case ('component') {
            <ng-container *ngComponentOutlet="tab.component" />
          }
          @default {
            Unsupported tab page kind: {{ tab.kind }}
          }
        }
      </ng-template>
    </ngn-tab>
  }
</ngn-tabs>
