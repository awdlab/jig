<!-- Mobile only (<=900px): breadcrumb lives in the content here since the
     topbar hides it at this width. -->
<ngn-breadcrumb class="nav:hidden block px-4 pt-4" [items]="breadcrumbItems()" />

<div class="flex min-h-0 w-full flex-1 justify-center">
  <div class="mx-auto flex w-full max-w-7xl min-w-0 gap-8 px-4 md:px-8">
    <!-- Centered content column -->
    <div class="flex h-full min-w-0 flex-1 flex-col">
      <h2 class="m-0 shrink-0 py-6 text-3xl">{{ page.title }}</h2>
      <ngn-docs-section
        class="min-h-0 w-full flex-1"
        [section]="page"
        (headings)="headings.set($event)"
      />
    </div>

    <!-- Auto-generated "on this page" rail -->
    @if (headings().length) {
      <aside class="hidden max-h-full w-56 shrink-0 self-start overflow-y-auto pt-8 xl:block">
        <ngn-docs-toc [headings]="headings()" />
      </aside>
    }
  </div>
</div>
