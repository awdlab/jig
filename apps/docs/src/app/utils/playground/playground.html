<div class="playground-wrapper flex w-full p-4 justify-between items-center gap-2 flex-wrap">
  <ng-content />
  <div class="flex flex-col w-[200px] gap-2">
    @if (component(); as component) {
      @if (internalControlName(); as internalControlName) {
        @for (input of componentInputs(); track $index) {
          <ngn-docs-playground-input
            [internalControlName]="internalControlName"
            [input]="input"
            [instance]="component"
          />
        }
      }
    }
  </div>
</div>
