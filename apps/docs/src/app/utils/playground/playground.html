<div class="playground-wrapper flex w-full h-full justify-between items-center gap-2 flex-wrap">
  <div class="flex flex-1 justify-center items-center p-4 min-w-[300px] min-h-[300px]">
    <ng-content />
  </div>
  <div
    class="panels max-w-fit flex-1 flex flex-col border-l border-(--ngn-color-surface-200) h-full"
  >
    <div
      class="h-16 bg-(--ngn-color-surface-50) flex items-center px-4 border-b border-(--ngn-color-surface-200)"
    >
      <span class="font-semibold">Control Properties</span>
    </div>
    <div
      class="properties-wrapper min-w-[400px] max-w-[800px] flex h-full bg-(--ngn-color-surface-25) overflow-hidden"
    >
      <ngn-docs-playground-inputs class="flex-1" [controls]="controls()" />
      <ngn-docs-tokens class="flex-1" [controls]="controls()" />
    </div>
  </div>
</div>
