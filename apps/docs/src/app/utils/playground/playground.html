<div
  class="playground-wrapper flex-col md:flex-row playground overflow-y-auto md:overflow-hidden flex w-full h-full justify-between items-center gap-2"
>
  <div class="flex flex-1 justify-center items-center p-4 min-w-[250px] min-h-[300px]">
    <ng-content />
  </div>
  <div
    class="panels bg-(--ngn-color-surface-50) w-full md:max-w-fit flex-1 flex flex-col md:h-full"
  >
    <div class="h-16 flex items-center px-4 border-b border-(--ngn-color-surface-200) border-l">
      <span class="font-semibold">Control Properties</span>
    </div>
    <div
      class="properties-wrapper md:overflow-y-auto min-w-[250px] md:max-w-[800px] flex md:h-full bg-(--ngn-color-surface-25) overflow-hidden"
    >
      <ngn-docs-playground-inputs
        class="flex-1 border-l border-(--ngn-color-surface-200)"
        [controls]="controls()"
      />
      <ngn-docs-tokens
        class="flex-1 border-l border-(--ngn-color-surface-200)"
        [controls]="controls()"
      />
    </div>
  </div>
</div>
