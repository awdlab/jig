<div
  class="playground-wrapper playground flex h-full w-full [scrollbar-gutter:stable] flex-col items-center justify-between gap-2 overflow-y-auto md:flex-row md:overflow-hidden"
>
  <div class="flex min-h-[300px] w-full min-w-[250px] flex-1 items-center justify-center p-4">
    <ng-content />
  </div>
  <div
    class="panels flex w-full flex-1 flex-col bg-(--jig-color-surface-50) md:h-full md:max-w-fit"
  >
    <div
      class="flex h-16 shrink-0 items-center border-b border-l border-(--jig-color-surface-200) px-4"
    >
      <span class="font-semibold">Control Properties</span>
    </div>
    <div
      class="properties-wrapper flex min-h-0 min-w-[250px] flex-1 overflow-hidden bg-(--jig-color-surface-25) md:max-w-[800px]"
    >
      <jig-docs-playground-inputs
        class="min-h-0 flex-1 [scrollbar-gutter:stable] overflow-y-auto border-l border-(--jig-color-surface-200) md:min-h-full"
        [controls]="controls()"
      />
      <jig-docs-tokens
        class="min-h-0 flex-1 [scrollbar-gutter:stable] overflow-y-auto border-l border-(--jig-color-surface-200) md:min-h-full"
        [controls]="controls()"
      />
    </div>
  </div>
</div>
