<div
  class="playground-wrapper playground overflow-y-auto flex flex-wrap w-full h-full justify-between items-center gap-2"
>
  <div class="flex flex-1 justify-center items-center p-4 md:min-w-[300px] min-h-[300px]">
    <ng-content />
  </div>
  <div
    class="panels bg-(--ngn-color-surface-50) max-w-fit flex-1 flex flex-col border-l border-(--ngn-color-surface-200) h-full"
  >
    <div class="h-16 flex items-center px-4 border-b border-(--ngn-color-surface-200)">
      <span class="font-semibold">Control Properties</span>
    </div>
    <div
      class="properties-wrapper md:min-w-[400px] md:max-w-[800px] flex h-full bg-(--ngn-color-surface-25) overflow-hidden"
    >
      <ngn-docs-playground-inputs class="flex-1" [controls]="controls()" />
      <ngn-docs-tokens class="flex-1" [controls]="controls()" />
    </div>
  </div>
</div>
