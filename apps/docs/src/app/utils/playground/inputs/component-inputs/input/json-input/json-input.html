<jig-input-field>
  <textarea
    jigInput
    rows="2"
    wrap="off"
    class="w-full max-w-full min-w-0 resize-y overflow-auto font-mono text-xs whitespace-pre"
    [invalid]="!!error()"
    [value]="text()"
    (blur)="commit($any($event.target).value)"
  ></textarea>
</jig-input-field>
@if (error(); as error) {
  <jig-hint [kind]="'error'">{{ error }}</jig-hint>
}
