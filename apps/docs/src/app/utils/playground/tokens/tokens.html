<div class="flex h-full flex-col gap-4 overflow-y-auto p-4">
  <div class="flex items-center gap-2 pb-2 font-semibold">
    <ngn-icon style="color: var(--ngn-color-primary-500)" [icon]="'img/icons/palette.svg'" />
    TOKENS
  </div>
  <ngn-message color="info" [icon]="'img/icons/pointer.svg'">
    Hover over a token to highlight the corresponding element in the preview.
  </ngn-message>
  <div
    class="mono rounded-sm bg-(--ngn-color-surface-100) p-2"
    (mouseenter)="activeToken.set(null)"
    [class.selected]="activeToken() === null"
  >
    * no highlight *
  </div>
  @for (group of tokensGroups(); track $index) {
    <div>
      <h4 class="text-base font-semibold">{{ group.name }}</h4>
      <div class="flex flex-col gap-2">
        @for (token of group.tokens; track $index) {
          <div
            [class.selected]="activeToken() === token"
            (mouseenter)="activeToken.set(token)"
            class="mono rounded-sm bg-(--ngn-color-surface-100) p-2"
          >
            {{ token.name }}
          </div>
        }
      </div>
    </div>
  }
</div>
