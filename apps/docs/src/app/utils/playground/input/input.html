@let label = input().name + (dataType()?.optional ? '' : '*');

@if (dataType(); as dataType) {
  @switch (dataType.kind) {
    @case ('primitive') {
      @switch (dataType.type) {
        @case ('string') {
          <ngn-input-field [label]="label">
            <input type="text" ngnInput [value]="value()" (valueChange)="value.set($event)" />
          </ngn-input-field>
        }
        @case ('number') {
          <ngn-input-field [label]="label">
            <input type="number" ngnInput [value]="value()" (valueChange)="value.set($event)" />
          </ngn-input-field>
        }
        @case ('boolean') {
          <ngn-switch [value]="value()" (valueChange)="value.set($event)" /> {{ label }}
        }
        @case ('date') {
          <ngn-calendar [label]="label" [value]="value()" (valueChange)="value.set($event)" />
        }
      }
    }
    @case ('literalUnion') {
      <ngn-select
        [value]="value()"
        [label]="label"
        (valueChange)="value.set($event)"
        [options]="dataType.values"
        [editable]="dataType.allowCustomValue"
      />
    }
  }
}
