<ngn-docs-hero-section />
@for (s of featureSections; track s.id; let i = $index) {
  <div
    [class]="
      i % 2 === 0
        ? 'block border-y border-(--ngn-color-surface-100) bg-(--ngn-color-surface-50)'
        : 'block'
    "
  >
    <ng-container *ngComponentOutlet="s.component" />
  </div>
}
<ngn-docs-site-footer [tinted]="lastTinted" />
