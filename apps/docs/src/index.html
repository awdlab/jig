<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>jig by awdlab</title>
    <!-- Pre-paint color scheme (no-flicker). Generated by colorSchemeInitScript();
         keep in sync with COLOR_SCHEME_STORAGE_KEY in @awdlab/jig. -->
    <script>
      (function () {
        try {
          var k = 'jig-color-scheme';
          var s = localStorage.getItem(k);
          var sys = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          var m = s === 'light' || s === 'dark' ? s : sys;
          if (m === 'dark') document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Splash for the client-rendered routes, where jig-root ships empty and
         stays blank until the bundle lands. The :has() rule hides it with no
         JS, so an SSR response never shows it. -->
    <link rel="preload" as="image" href="/img/logo.png?v=4" />
    <style>
      #jig-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: grid;
        place-items: center;
        background: #ffffff;
        /* Hiding is instant (see below); coming back waits out any route
           transition, which empties jig-root for a frame. */
        transition:
          opacity 0.35s ease 10s,
          visibility 0.35s 10s;
        /* Fail-safe: never trap the page behind the overlay. */
        animation: jig-splash-bail 1ms linear 20s forwards;
      }
      .dark #jig-splash {
        background: #0b0b0f;
      }
      body:has(jig-root router-outlet + *) #jig-splash,
      body:has(jig-root > :not(router-outlet)) #jig-splash {
        opacity: 0;
        visibility: hidden;
        transition-delay: 0s;
      }
      #jig-splash .jig-splash-stack {
        display: grid;
        place-items: center;
      }
      #jig-splash .jig-splash-stack > * {
        grid-area: 1 / 1;
      }
      #jig-splash .jig-splash-ring {
        width: 84px;
        height: 84px;
        border-radius: 50%;
        border: 2px solid rgba(255, 36, 138, 0.18);
        border-top-color: #ff248a;
        animation: jig-splash-spin 0.9s linear infinite;
      }
      #jig-splash img {
        width: 44px;
        height: 44px;
        animation: jig-splash-pulse 1.8s ease-in-out infinite;
      }
      @keyframes jig-splash-spin {
        to {
          transform: rotate(1turn);
        }
      }
      @keyframes jig-splash-pulse {
        50% {
          opacity: 0.55;
          transform: scale(0.94);
        }
      }
      @keyframes jig-splash-bail {
        to {
          opacity: 0;
          visibility: hidden;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #jig-splash .jig-splash-ring,
        #jig-splash img {
          animation: none;
        }
      }
    </style>

    <!-- Favicon / Manifest -->
    <link rel="icon" type="image/png" href="/favicon/favicon-96x96.png?v=3" sizes="96x96" />
    <link rel="shortcut icon" href="/favicon/favicon.ico?v=3" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png?v=3" />
    <meta name="apple-mobile-web-app-title" content="jig docs" />
    <link rel="manifest" href="/favicon/site.webmanifest?v=3" />
    <!-- Baseline metadata. Per-route title, description, canonical and social
         cards are set by the Seo service and are present in the SSR response. -->
    <meta
      name="description"
      content="A signal-based component library for Angular 22+ — 50+ accessible, themeable, tree-shakeable controls. Zoneless, standalone, no ControlValueAccessor."
    />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0b0f" />
    <meta name="color-scheme" content="light dark" />
    <meta name="author" content="awdlab" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareSourceCode",
        "name": "@awdlab/jig",
        "description": "A signal-based component library for Angular 22+ — accessible, themeable, tree-shakeable controls.",
        "url": "https://jig.awdlab.dev",
        "codeRepository": "https://github.com/awdlab/jig",
        "programmingLanguage": "TypeScript",
        "runtimePlatform": "Angular",
        "license": "https://opensource.org/licenses/MIT",
        "author": { "@type": "Organization", "name": "awdlab" }
      }
    </script>

    <!-- Analytics -->
    <script
      defer
      src="https://analytics.awdlab.dev/script.js"
      data-website-id="c811cc11-3ef2-4afe-a87e-442294df5bca"
      data-domains="jig.awdlab.dev"
    ></script>
    <script
      defer
      src="https://analytics.awdlab.dev/recorder.js"
      data-website-id="c811cc11-3ef2-4afe-a87e-442294df5bca"
      data-sample-rate="1"
      data-mask-level="moderate"
      data-max-duration="900000"
      data-domains="jig.awdlab.dev"
    ></script>
  </head>
  <body>
    <div id="jig-splash" aria-hidden="true">
      <div class="jig-splash-stack">
        <span class="jig-splash-ring"></span>
        <img src="/img/logo.png?v=4" alt="" width="44" height="44" />
      </div>
    </div>
    <jig-root></jig-root>
  </body>
</html>
