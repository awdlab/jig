<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ngn-controls</title>
    <!-- Pre-paint color scheme (no-flicker). Generated by colorSchemeInitScript();
         keep in sync with COLOR_SCHEME_STORAGE_KEY in @ngneers/controls. -->
    <script>
      (function () {
        try {
          var k = 'ngn-color-scheme';
          var s = localStorage.getItem(k);
          var sys = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          var m = s === 'light' || s === 'dark' ? s : sys;
          if (m === 'dark') document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Favicon / Manifest -->
    <link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="shortcut icon" href="/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="ngneers.dev" />
    <link rel="manifest" href="/favicon/site.webmanifest" />

    <!-- Baseline metadata. Per-route title, description, canonical and social
         cards are set by the Seo service and are present in the SSR response. -->
    <meta
      name="description"
      content="A signal-based component library for Angular 22+ — 50+ accessible, themeable, tree-shakeable controls. Zoneless, standalone, no ControlValueAccessor."
    />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0b0f" />
    <meta name="color-scheme" content="light dark" />
    <meta name="author" content="NGneers" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareSourceCode",
        "name": "@ngneers/controls",
        "description": "A signal-based component library for Angular 22+ — accessible, themeable, tree-shakeable controls.",
        "url": "https://ngneers.dev",
        "codeRepository": "https://github.com/NGneers/controls",
        "programmingLanguage": "TypeScript",
        "runtimePlatform": "Angular",
        "license": "https://opensource.org/licenses/MIT",
        "author": { "@type": "Organization", "name": "NGneers" }
      }
    </script>
  </head>
  <body>
    <ngn-root></ngn-root>
  </body>
</html>
