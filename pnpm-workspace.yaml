packages:
  - packages/*
  - apps/*

allowBuilds:
  '@parcel/watcher': true
  awesome-logging: false
  esbuild: true
  lmdb: false
  msgpackr-extract: false
  # Pulled in by @huggingface/transformers, which the docs use for its tokenizer
  # only — no ONNX inference, no image pipeline.
  onnxruntime-node: false
  protobufjs: false
  sharp: false
  unrs-resolver: false

catalog:
  '@angular/animations': 22.0.5
  '@angular/build': 22.1.3
  '@angular/cli': 22.1.3
  '@angular/common': 22.1.0
  '@angular/compiler': 22.1.0
  '@angular/compiler-cli': 22.1.0
  '@angular/core': 22.1.0
  '@angular/forms': 22.1.0
  '@angular/platform-browser': 22.1.0
  '@angular/platform-server': 22.1.0
  '@angular/router': 22.1.0
  '@angular/ssr': 22.1.3
  typescript: ~7.0.2

ignoredBuiltDependencies:
  - '@parcel/watcher'
  - awesome-logging
  - less
  - lmdb
  - msgpackr-extract

minimumReleaseAgeExclude:
  - awesome-publish@0.0.7

onlyBuiltDependencies:
  - esbuild
