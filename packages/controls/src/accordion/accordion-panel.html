<header
  [ngClass]="theme.class('panel-header')"
  tabindex="0"
  (click)="toggle()"
  (keydown)="handleKeydown($event)"
>
  @if (headerTemplate()) {
    <ng-container
      *ngTemplateOutlet="
        headerTemplate();
        context: { $implicit: { panelId: panelId(), text: header(), expanded: open() } }
      "
    ></ng-container>
  }
  <ngn-icon
    [defaultIcon]="open() ? 'fa-solid fa-chevron-up' : 'fa-solid fa-chevron-down'"
    [icon]="open() ? iconExpanded() : iconCollapsed()"
  />
</header>

<div
  [ngClass]="
    theme.classes({
      'panel-content-expander': true,
      'panel-content-expander-collapsed': !open(),
    })
  "
  (transitionend)="handleTransitionEnd()"
>
  <div [ngClass]="theme.class('panel-content')">
    <ngn-defer
      [lazyContent]="contentTemplate()"
      [open]="lazyInt() && !cacheInt() ? afterTransitionOpen() : open()"
      [hiddenOnClosed]="false"
      [cache]="cacheInt()"
      [lazy]="lazyInt()"
    />
  </div>
</div>

<ng-template #defaultHeaderTemplate let-header [ngnTemplate]="templateTypes.header">
  <span
    [ngClass]="theme.class('panel-header-text')"
    [attr.data-testid]="'accordion-header-' + header.panelId"
  >
    {{ header.text }}
  </span>
</ng-template>
