<header>
  <button
    [ngClass]="
      theme.classes({
        'panel-header': true,
        'panel-header-disabled': disabled(),
      })
    "
    [id]="headerId()"
    [disabled]="disabled()"
    [ariaExpanded]="open()"
    (click)="toggle()"
    [attr.aria-controls]="contentId()"
  >
    @if (headerTemplate()) {
      <ng-container
        *ngTemplateOutlet="
          headerTemplate();
          context: { $implicit: { panelId: panelId(), text: header(), expanded: open() } }
        "
      ></ng-container>
    }
    <ngn-icon
      [defaultIcon]="open() ? 'fa-solid fa-chevron-up' : 'fa-solid fa-chevron-down'"
      [icon]="open() ? iconExpanded() : iconCollapsed()"
    />
  </button>
</header>

<div
  [ngClass]="
    theme.classes({
      'panel-content-expander': true,
      'panel-content-expander-collapsed': !open(),
    })
  "
  (transitionend)="handleTransitionEnd()"
>
  <div
    [ngClass]="theme.class('panel-content')"
    [id]="contentId()"
    [attr.aria-labelledby]="headerId()"
    [attr.aria-hidden]="!open()"
    role="region"
  >
    <ngn-defer
      [lazyContent]="contentTemplate()"
      [open]="lazyInt() && !cacheInt() ? afterTransitionOpen() : open()"
      [hiddenOnClosed]="false"
      [cache]="cacheInt()"
      [lazy]="lazyInt()"
    />
  </div>
</div>

<ng-template #defaultHeaderTemplate let-header [ngnTemplate]="templateTypes.header">
  <span [ngClass]="theme.class('panel-header-text')">
    {{ header.text }}
  </span>
</ng-template>
