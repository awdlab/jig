<div [style.height.px]="dummyHeight()"></div>
<div style="position: absolute; left: 0; right: 0; bottom: 0" [style.top.px]="itemsTop()">
  @for (item of visibleItems(); track item.index) {
    <ng-container
      *ngTemplateOutlet="itemTemplate(); context: { $implicit: item.item }"
    ></ng-container>
  }
</div>
