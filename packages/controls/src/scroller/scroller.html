<div aria-hidden="true" [ngClass]="theme.class('spacer')" [style.height.px]="paddingTop()"></div>

@if (latestStickyItem(); as latestStickyItem) {
  <ng-container
    *ngTemplateOutlet="
      itemTemplate();
      context: { $implicit: latestStickyItem.item, index: latestStickyItem.index }
    "
  ></ng-container>
}

@for (item of visibleItems(); track track(item)) {
  <ng-container
    *ngTemplateOutlet="itemTemplate(); context: { $implicit: item.item, index: item.index }"
  ></ng-container>
}

<div aria-hidden="true" [ngClass]="theme.class('spacer')" [style.height.px]="paddingBottom()"></div>
