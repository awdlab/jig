@if (buttons() !== 'increment') {
  <button
    ngnButton
    type="button"
    [kind]="'icon'"
    tabindex="-1"
    aria-hidden="true"
    [ptInt]="this"
    [ptClass]="{ button: true, decrement: true }"
    [disabled]="!canStep(-1)"
    (pointerdown)="pressStart($event, -1)"
    (pointerup)="pressEnd()"
    (pointerleave)="pressEnd()"
    (pointercancel)="pressEnd()"
    (click)="clicked($event)"
  >
    <ngn-icon defaultIcon="spin-decrement" [icon]="iconDecrement()" />
  </button>
}
@if (buttons() !== 'decrement') {
  <button
    ngnButton
    type="button"
    [kind]="'icon'"
    tabindex="-1"
    aria-hidden="true"
    [ptInt]="this"
    [ptClass]="{ button: true, increment: true }"
    [disabled]="!canStep(1)"
    (pointerdown)="pressStart($event, 1)"
    (pointerup)="pressEnd()"
    (pointerleave)="pressEnd()"
    (pointercancel)="pressEnd()"
    (click)="clicked($event)"
  >
    <ngn-icon defaultIcon="spin-increment" [icon]="iconIncrement()" />
  </button>
}
