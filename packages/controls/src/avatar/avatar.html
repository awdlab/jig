<ng-content>
  @if (!image() || imageLoadFailed()) {
    <span
      [ptInt]="this"
      [ptClass]="'initials'"
      [style.--letterCount]="initialsLimited()?.length || 1"
    >
      {{ initialsLimited() }}
    </span>
  } @else {
    <img
      [ptInt]="this"
      [ptClass]="'image'"
      [src]="image()"
      [alt]="alt() ?? ''"
      (error)="imageLoadFailed.set(true)"
    />
  }
</ng-content>
