<button
  type="button"
  jigButton
  [kind]="config().kind"
  [color]="config().color"
  [jigButtonInline]="inline()"
  [disabled]="config().disabled"
  (click)="click($event)"
  [attr.data-test-id]="config().testId"
  [attr.aria-keyshortcuts]="ariaShortcut()"
  [jigTooltip]="tooltip()"
  jigTooltipAutoAriaMode="label"
>
  @if (config().icon || config().defaultIcon) {
    <jig-icon [icon]="config().icon" [defaultIcon]="config().defaultIcon" />
  } @else {
    {{ maybeCallback(config().label) }}
  }
  @if (shortcutHint(); as shortcut) {
    <jig-kbd [shortcut]="shortcut" aria-hidden="true" />
  }
</button>
