<button
  type="button"
  ngnButton
  [kind]="config().kind"
  [disabled]="config().disabled"
  (click)="click($event)"
  [attr.data-test-id]="config().testId"
>
  @if (config().icon || config().defaultIcon) {
    <ngn-icon
      [ngnTooltip]="config().label"
      [icon]="config().icon"
      [defaultIcon]="config().defaultIcon"
    />
  } @else {
    {{ config().label }}
  }
</button>
