<button
  type="button"
  ngnButton
  [kind]="config().kind"
  [color]="config().color"
  [ngnButtonInline]="inline()"
  [disabled]="config().disabled"
  (click)="click($event)"
  [attr.data-test-id]="config().testId"
  [ngnTooltip]="config().kind === 'icon' ? maybeCallback(config().label) : null"
  ngnTooltipAutoAriaMode="label"
>
  @if (config().icon || config().defaultIcon) {
    <ngn-icon [icon]="config().icon" [defaultIcon]="config().defaultIcon" />
  } @else {
    {{ maybeCallback(config().label) }}
  }
</button>
