<!-- eslint-disable-next-line @angular-eslint/template/interactive-supports-focus -->
<dialog
  #dialog
  [ngClass]="theme.classes({ '': true, modal: modal() })"
  [attr.closedby]="modalClosedBy()"
  [autofocus]="autofocus()"
  [attr.aria-labelledby]="headerId"
  (cancel)="onCancel()"
  (toggle)="onCancel($event)"
  (keydown)="onCancel($event)"
  [style.minWidth]="size().minWidth"
  [style.maxWidth]="size().maxWidth"
  [style.width]="size().width"
  [style.minHeight]="size().minHeight"
  [style.maxHeight]="size().maxHeight"
  [ngnMovable]="movable()"
  [ngnResizable]="resizable()"
  [ngnResizableSizeLimits]="{
    minWidth: size().minWidth,
    minHeight: size().minHeight,
    maxWidth: size().maxWidth,
    maxHeight: size().maxHeight,
  }"
  [ngnMovableDragHandle]="header"
  [attr.popover]="popoverClosedBy()"
>
  <header #header [ngClass]="theme.class('header')">
    <ng-template
      [ngTemplateOutlet]="headerTemplate()"
      [ngTemplateOutletContext]="{ headerId, title: title() }"
    ></ng-template>
    <button ngnButton [kind]="'icon'" (click)="closeWithButton()" tabindex="-1">
      <ngn-icon [defaultIcon]="'fa-solid fa-xmark'" [size]="'12px'"></ngn-icon>
    </button>
  </header>

  @if (typedContent().template; as template) {
    <ngn-defer
      [lazyContent]="template"
      [lazy]="lazy()"
      [open]="open()"
      [cache]="cache()"
      [ngClass]="theme.class('content')"
    >
      <ng-content />
    </ngn-defer>
  } @else if (typedContent().string; as string) {
    <div [ngClass]="theme.class('content')">
      {{ string }}
    </div>
  } @else if (typedContent().component; as component) {
    <div [ngClass]="theme.class('content')">
      <ng-container *ngComponentOutlet="component; inputs: contentComponentInputs()" />
    </div>
  }

  <footer [ngClass]="theme.class('footer')">
    <ng-template [ngTemplateOutlet]="footerTemplate()"></ng-template>
  </footer>
</dialog>

<ng-template
  #defaultHeaderTemplate
  [ngnTemplate]="templateTypes.header"
  let-headerId="headerId"
  let-title="title"
>
  @if (title) {
    <h2 [ngClass]="theme.class('default-header')" [id]="headerId">{{ title }}</h2>
  } @else {
    <div>
      <!-- Placeholder for default header content -->
    </div>
  }
</ng-template>

<ng-template #defaultFooterTemplate>
  <div [ngClass]="theme.class('default-footer')">
    @for (button of footerButtons(); track $index) {
      <ngn-action-button [config]="singleButtonTypeFix(button)" (clicked)="buttonClick($event)" />
    }
  </div>
</ng-template>
