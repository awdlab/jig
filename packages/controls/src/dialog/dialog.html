<dialog
  #dialog
  [ngClass]="theme.class()"
  [attr.closedby]="closedBy()"
  [autofocus]="autofocus()"
  [attr.aria-labelledby]="headerId"
  (cancel)="onCancel()"
  [style.minWidth]="size().minWidth"
  [style.maxWidth]="size().maxWidth"
  [style.width]="size().width"
  [style.minHeight]="size().minHeight"
  [style.maxHeight]="size().maxHeight"
>
  <header [ngClass]="theme.class('header')">
    <ng-template
      [ngTemplateOutlet]="headerTemplate()"
      [ngTemplateOutletContext]="{ headerId, title: title() }"
    ></ng-template>
    <button ngnButton [kind]="'icon'" (click)="open.set(false)" tabindex="-1">
      <ngn-icon [defaultIcon]="'fa-solid fa-xmark'" [size]="'12px'"></ngn-icon>
    </button>
  </header>

  <ngn-defer
    [lazyContent]="contentTemplate()"
    [lazy]="lazy()"
    [open]="open()"
    [cache]="cache()"
    [ngClass]="theme.class('content')"
  >
    <ng-content />
  </ngn-defer>

  <footer>
    <ng-template [ngTemplateOutlet]="footerTemplate()"></ng-template>
  </footer>
</dialog>

<ng-template
  #defaultHeaderTemplate
  [ngnTemplate]="templateTypes.header"
  let-headerId="headerId"
  let-title="title"
>
  @if (title) {
    <h2 [ngClass]="theme.class('default-header')" [id]="headerId">{{ title }}</h2>
  } @else {
    <div>
      <!-- Placeholder for default header content -->
    </div>
  }
</ng-template>

<ng-template #defaultFooterTemplate> </ng-template>
