<input
  type="checkbox"
  [value]="value()"
  (change)="changed($event)"
  [indeterminate]="indeterminate()"
  [ngClass]="theme.class('input')"
  [attr.disabled]="isDisabled() ? '' : undefined"
  [ariaInvalid]="isInvalid() ? 'true' : undefined"
/>
<div
  [ngClass]="
    theme.classes({
      box: true,
      'box-checked': !!value(),
      'box-indeterminate': indeterminate(),
    })
  "
>
  @if (indeterminate()) {
    <ngn-icon
      [ngClass]="theme.class('box-icon')"
      [icon]="iconIndeterminate()"
      [defaultIcon]="'minus'"
      [animate.enter]="theme.class('anim-box-icon-enter')"
      [animate.leave]="theme.class('anim-box-icon-leave')"
    />
  } @else if (value()) {
    <ngn-icon
      [ngClass]="theme.class('box-icon')"
      [icon]="iconChecked()"
      [defaultIcon]="'check'"
      [animate.enter]="theme.class('anim-box-icon-enter')"
      [animate.leave]="theme.class('anim-box-icon-leave')"
    />
  } @else if (iconUnchecked()) {
    <ngn-icon
      [ngClass]="theme.class('box-icon')"
      [icon]="iconUnchecked()"
      [animate.enter]="theme.class('anim-box-icon-enter')"
      [animate.leave]="theme.class('anim-box-icon-leave')"
    />
  }
</div>
