<input
  type="checkbox"
  [value]="value()"
  (change)="changed($event)"
  [indeterminate]="indeterminate()"
  [ngClass]="theme.class('input')"
/>
<div
  [ngClass]="
    theme.classes({
      box: true,
      'box-checked': !!value(),
      'box-indeterminate': indeterminate(),
    })
  "
>
  @if (indeterminate()) {
    <ngn-icon
      [ngClass]="theme.class('box-icon')"
      [icon]="iconIndeterminate()"
      [defaultIcon]="'minus'"
    />
  } @else if (value()) {
    <ngn-icon [ngClass]="theme.class('box-icon')" [icon]="iconChecked()" [defaultIcon]="'check'" />
  } @else if (iconUnchecked()) {
    <ngn-icon [ngClass]="theme.class('box-icon')" [icon]="iconUnchecked()" />
  }
</div>
