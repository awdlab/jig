<div
  [ptInt]="this"
  [ptClass]="{
    box: true,
    'box-checked': !!value(),
    'box-indeterminate': indeterminate(),
  }"
>
  @if (indeterminate()) {
    <ngn-icon
      [ptInt]="this"
      [ptClass]="'box-icon'"
      [icon]="iconIndeterminate()"
      [defaultIcon]="'minus'"
      [animate.enter]="theme.class('anim-box-icon-enter')"
      [animate.leave]="theme.class('anim-box-icon-leave')"
    />
  } @else if (value()) {
    <ngn-icon
      [ptInt]="this"
      [ptClass]="'box-icon'"
      [icon]="iconChecked()"
      [defaultIcon]="'check'"
      [animate.enter]="theme.class('anim-box-icon-enter')"
      [animate.leave]="theme.class('anim-box-icon-leave')"
    />
  } @else if (iconUnchecked()) {
    <ngn-icon
      [ptInt]="this"
      [ptClass]="'box-icon'"
      [icon]="iconUnchecked()"
      [animate.enter]="theme.class('anim-box-icon-enter')"
      [animate.leave]="theme.class('anim-box-icon-leave')"
    />
  }
</div>
<input
  type="checkbox"
  [checked]="value()"
  (change)="changed($event)"
  (click)="onClick($event)"
  [indeterminate]="indeterminate()"
  [ptInt]="this"
  [ptClass]="'input'"
  [attr.disabled]="disabled() ? '' : undefined"
  [ariaReadOnly]="readonly() ? '' : undefined"
  [ariaInvalid]="invalid() ? 'true' : undefined"
  [ariaLabelledByElements]="labelledBy()"
  (blur)="touched.set(true)"
  [id]="inputId()"
/>
