<jig-item-view
  #itemView
  [ptInt]="this"
  [ptDep]="'item-view'"
  [items]="items()"
  [idField]="'id'"
  [templateItem]="itemTemplate()"
  [templateSeparator]="separatorTemplate()"
  [templateOverflow]="usedOverflowTemplate"
  [iconItemSeparator]="iconItemSeparator()"
  [overflowStrategy]="'start'"
  [overflowStrategyFreezeCount]="1"
/>

<ng-template #usedOverflowTemplate [jigTemplate]="itemView.templateTypes.overflow" let-overflow>
  <ng-container
    *ngTemplateOutlet="
      overflowTemplate();
      context: { $implicit: { icon: iconOverflow(), overflowingItems: overflow.overflowItems } }
    "
  ></ng-container>
</ng-template>

<ng-template #defaultItemTemplate [jigTemplate]="templateTypes.item" let-item>
  @let current = item.id === currentId();
  @let classes = { item: true, 'item-clickable': !current && (!!item.callback || !!item.route) };
  @if (!current && item.route) {
    <a [ptInt]="this" [ptClass]="classes" [routerLink]="item.route" (click)="item.callback?.()">{{
      maybeCallback(item.label)
    }}</a>
  } @else if (!current && item.callback) {
    <!-- A callback without a route is not a link: a button is focusable and keyboard-operable, an href-less anchor is neither. -->
    <button type="button" [ptInt]="this" [ptClass]="classes" (click)="item.callback()">
      {{ maybeCallback(item.label) }}
    </button>
  } @else {
    <span [ptInt]="this" [ptClass]="classes" [attr.aria-current]="current ? 'page' : null">{{
      maybeCallback(item.label)
    }}</span>
  }
</ng-template>

<ng-template #defaultSeparatorTemplate [jigTemplate]="templateTypes.separator" let-separator>
  <span [ptInt]="this" [ptClass]="'separator'">
    <jig-icon defaultIcon="breadcrumb-separator" [icon]="separator.icon" />
  </span>
</ng-template>

<ng-template #defaultOverflowTemplate [jigTemplate]="templateTypes.overflow" let-overflow>
  <button
    #menuAnchor
    [ptInt]="this"
    [ptClass]="'overflow'"
    [attr.aria-label]="i18n['breadcrumb_overflow']()"
    (click)="menu.show()"
  >
    <jig-icon defaultIcon="breadcrumb-overflow" [icon]="overflow.icon" />
  </button>
  <jig-menu
    #menu
    [ptInt]="this"
    [ptDep]="'menu'"
    [popover]="true"
    [items]="overflow.overflowingItems"
    [anchor]="menuAnchor"
  />
</ng-template>
