<ngn-item-view
  #itemView
  [items]="items()"
  [templateItem]="itemTemplate()"
  [templateSeparator]="separatorTemplate()"
  [templateOverflow]="overflowTemplate"
  [overflowStrategy]="'startButOne'"
/>

<ng-template #overflowTemplate [ngnTemplate]="itemView.templateTypes.overflow" let-overflow>
  <span
    [ngClass]="
      theme.classes({
        item: true,
        'item-clickable': true,
      })
    "
    >...</span
  >
</ng-template>

<ng-template #defaultItemTemplate [ngnTemplate]="templateTypes.item" let-item>
  <button
    [ngClass]="
      theme.classes({
        item: true,
        'item-clickable': !!item.callback || !!item.route,
      })
    "
    (click)="item.callback?.()"
    [routerLink]="item.route"
  >
    {{ item.label }}
  </button>
</ng-template>

<ng-template #defaultSeparatorTemplate [ngnTemplate]="templateTypes.separator" let-separator>
  <span [ngClass]="theme.class('separator')">
    <ngn-icon defaultIcon="fa-solid fa-chevron-right" [icon]="separator.icon" />
  </span>
</ng-template>
