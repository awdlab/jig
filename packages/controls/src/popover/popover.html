<div
  [ngClass]="theme.class()"
  #popover
  popover
  (toggle)="onToggle($event)"
  style="position: fixed; display: flex; flex-direction: column"
>
  <div [ngClass]="theme.class('content')" style="height: 100%; max-height: fit-content">
    <ngn-lazy-cacher
      [lazyContent]="lazyContent()"
      [open]="isOpen()"
      [cache]="appliedOptions().cache"
    >
      <ng-content></ng-content>
    </ngn-lazy-cacher>
  </div>
</div>
