<div
  [ngClass]="theme.class()"
  #popover
  popover
  (toggle)="onToggle($event)"
  [style.min-height]="!hasShrinkableContent() ? 'fit-content' : null"
>
  <div
    #content
    [ngClass]="
      theme.classes({
        content: true,
        'content-closing': !this.isOpen() && !this.isFullyClosed(),
      })
    "
    [style.min-height]="!hasShrinkableContent() ? 'fit-content' : null"
  >
    <ngn-defer
      [lazyContent]="lazyContent()"
      [open]="isOpen() || !isFullyClosed()"
      [cache]="appliedOptions().cache"
    >
      <ng-content></ng-content>
    </ngn-defer>
  </div>
</div>
