<ng-template #renderedContent>
  @if (contentTemplate(); as tpl) {
    <ng-container [ngTemplateOutlet]="tpl" />
  } @else if (contentString(); as text) {
    {{ text }}
  } @else {
    <ng-content />
  }
</ng-template>

@if (icon() || defaultIconKey()) {
  <awd-icon
    [ptInt]="this"
    [ptClass]="'icon'"
    [icon]="icon()"
    [defaultIcon]="defaultIconKey()"
    [ngnTooltip]="iconOnly() ? renderedContent : null"
    [ngnTooltipAutoAriaMode]="'label'"
  />
}
@if (!iconOnly()) {
  <ng-container [ngTemplateOutlet]="renderedContent" />
}
