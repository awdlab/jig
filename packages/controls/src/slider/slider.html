<!-- eslint-disable @angular-eslint/template/interactive-supports-focus -->
<div
  #track
  [ptInt]="this"
  [ptClass]="'track'"
  jigDrag
  (pointerdown)="onTrackPointerDown($event)"
  (dragged)="onDragged($event)"
  (dragEnd)="onDragEnd()"
>
  <div
    [ptInt]="this"
    [ptClass]="'fill'"
    [style.--startPercent.%]="startPercent()"
    [style.--valuePercent.%]="endPercent()"
  ></div>
  @if (isRange()) {
    <div
      [ptInt]="this"
      [ptClass]="'thumb'"
      role="slider"
      [attr.tabindex]="disabled() ? -1 : 0"
      [attr.aria-label]="translations['slider_rangeStart']()"
      [attr.aria-valuemin]="min()"
      [attr.aria-valuemax]="startBounds()[1]"
      [attr.aria-valuenow]="values()[0]"
      [attr.aria-valuetext]="valueTextFor(values()[0])"
      [attr.aria-orientation]="vertical() ? 'vertical' : 'horizontal'"
      [attr.aria-readonly]="readonly() ? 'true' : null"
      [style.--valuePercent.%]="startPercent()"
      (pointerdown)="onThumbPointerDown('start')"
      (keydown)="onKeyDown($event, 'start')"
      (blur)="markTouched()"
    ></div>
  }
  <div
    [ptInt]="this"
    [ptClass]="'thumb'"
    [attr.role]="isRange() ? 'slider' : null"
    [attr.tabindex]="isRange() ? (disabled() ? -1 : 0) : null"
    [attr.aria-label]="isRange() ? translations['slider_rangeEnd']() : null"
    [attr.aria-valuemin]="isRange() ? endBounds()[0] : null"
    [attr.aria-valuemax]="isRange() ? max() : null"
    [attr.aria-valuenow]="isRange() ? values()[1] : null"
    [attr.aria-valuetext]="isRange() ? valueTextFor(values()[1]) : null"
    [attr.aria-orientation]="isRange() ? (vertical() ? 'vertical' : 'horizontal') : null"
    [attr.aria-readonly]="isRange() && readonly() ? 'true' : null"
    [style.--valuePercent.%]="endPercent()"
    (pointerdown)="onThumbPointerDown('end')"
    (keydown)="onKeyDown($event, 'end')"
    (blur)="markTouched()"
  ></div>
</div>
