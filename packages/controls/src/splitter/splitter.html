<ng-content />

<ng-template #defaultDividerTemplate [ngnTemplate]="dividerTemplateType" let-index="index">
  <div
    [style.grid-area]="`ngn-divider-${index}`"
    [ptInt]="this"
    [ptClass]="{
      divider: true,
      'divider-dragging': calculator().dragContext()?.dividerIndex === index,
    }"
  >
    <button
      role="separator"
      [aria-orientation]="layout()"
      [aria-label]="translations['splitter_handleLabel']()"
      [ptInt]="this"
      [ptClass]="'divider-handle'"
      (pointerdown)="onHandlePointerDown(index, $event)"
      (pointermove)="onHandlePointerMove(index, $event)"
      (pointerup)="onHandlePointerUp(index, $event)"
      (pointercancel)="onHandlePointerCancel(index, $event)"
      (keydown)="onHandleKeyDown(index, $event)"
    ></button>
  </div>
</ng-template>
