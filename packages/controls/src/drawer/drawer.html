<header [ngClass]="theme.class('header')">
  <ng-container
    *ngTemplateOutlet="
      headerTemplate();
      context: { $implicit: { close: doClose, text: this.header() } }
    "
  />
</header>
<ngn-defer
  [lazyContent]="contentTemplate()"
  [open]="open() || !isFullyClosed()"
  [lazy]="lazy()"
  [cache]="cache()"
>
  <ng-content />
</ngn-defer>
@if (footerTemplate(); as footerTemplate) {
  <footer [ngClass]="theme.class('footer')">
    <ng-container *ngTemplateOutlet="footerTemplate" />
  </footer>
}

<ng-template #defaultHeaderTemplate [ngnTemplate]="templateTypes.header" let-header>
  <div [ngClass]="theme.class('default-header')">
    <span [ngClass]="theme.class('default-header-text')">{{ header.text }}</span>
    <button ngnButton [kind]="'icon'" aria-label="close" (click)="header.close()">
      <ngn-icon defaultIcon="xmark" [icon]="iconClose()" />
    </button>
  </div>
</ng-template>
