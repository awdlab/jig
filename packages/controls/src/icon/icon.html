@if (icon()) {
  <ng-container
    *ngTemplateOutlet="
      usedIconTemplate();
      context: {
        $implicit: {
          icon: icon(),
        },
      }
    "
  >
  </ng-container>

  <ng-template #defaultIconTemplate [ngnTemplate]="templateType" let-icon
    ><i [style.--fa-display]="'block'" class="{{ icon.icon }}"></i
  ></ng-template>
} @else {
  <!-- imported svg icon -->
  @if (defaultIconSvg(); as defaultIcon) {
    <div [ngClass]="theme.class('default')" [innerHtml]="defaultIcon"></div>
  }
}
