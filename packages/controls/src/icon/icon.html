@if (icon()) {
  <ng-container
    *ngTemplateOutlet="
      usedIconTemplate();
      context: {
        $implicit: {
          icon: icon(),
          size: size(),
        },
      }
    "
  >
  </ng-container>

  <ng-template #defaultIconTemplate [ngnTemplate]="templateType" let-icon
    ><i
      [style.--fa-display]="'block'"
      [style.font-size]="icon.size"
      [style.width]="icon.size"
      class="{{ icon.icon }}"
    ></i
  ></ng-template>
} @else {
  <i
    [style.font-size]="size()"
    [style.width]="size()"
    [style.--fa-display]="'block'"
    class="{{ defaultIcon() }}"
  ></i>
}
