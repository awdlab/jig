<div [ptInt]="this" [ptClass]="'search-row'">
  <jig-input-field
    [ptInt]="this"
    [ptDep]="'search-field'"
    [showClearButton]="true"
    [disabled]="disabled()"
    [readonly]="readonly()"
  >
    <input
      jigInput
      [ptInt]="this"
      [ptDep]="'search-input'"
      [value]="searchInput()"
      [disabled]="disabled()"
      [readOnly]="readonly()"
      [attr.aria-label]="i18n['filterListBox_search']()"
      (valueChange)="searchInput.set($event)"
    />
    <jig-icon [ptInt]="this" [ptDep]="'search-icon'" defaultIcon="search" [icon]="iconSearch()" />
  </jig-input-field>

  @if (attributes()) {
    <!-- The badge sits on a wrapper: its count is decorative text that must not
         compete with the button's accessible name. -->
    <span [ptInt]="this" [ptClass]="'trigger'" [jigBadge]="activeConditions().length">
      <button
        #filterTrigger
        type="button"
        jigButton
        kind="icon"
        [ptInt]="this"
        [ptDep]="'filter-trigger'"
        [disabled]="disabled() || readonly()"
        [attr.aria-label]="filterTriggerLabel()"
        (click)="show()"
      >
        <jig-icon
          [defaultIcon]="activeConditions().length ? 'filter-active' : 'filter-inactive'"
          [icon]="iconFilter()"
        />
      </button>
    </span>
  }
</div>

@if (attributes(); as attributes) {
  @let anchor = filterAnchor();
  @if (anchor) {
    <jig-attribute-filter
      [ptInt]="this"
      [ptDep]="'filter'"
      mode="headless"
      [anchor]="anchor.nativeElement"
      [data]="filterData()"
      [attributes]="attributes"
      [allowMultiple]="allowMultiple()"
      [filterLocally]="false"
      [value]="filterConfig()"
      [disabled]="disabled()"
      [readonly]="readonly()"
      (filterChange)="filterConfig.set($event)"
    />
  }
}

@if (showActiveFilters() && chips().length) {
  <div
    [ptInt]="this"
    [ptClass]="'chips'"
    role="group"
    [attr.aria-label]="i18n['filterListBox_activeFilters']()"
  >
    @for (chip of chips(); track chip.index) {
      <jig-chip
        [ptInt]="this"
        [ptDep]="'chip'"
        [closable]="true"
        (closed)="removeCondition(chip.index)"
        >{{ chip.label }}</jig-chip
      >
    }
  </div>
}

<jig-list-box
  [ptInt]="this"
  [ptDep]="'list-box'"
  style="flex: 1; min-height: 0"
  [items]="narrowedItems()"
  [filter]="filter()"
  [filterText]="searchText()"
  [selectable]="selectable() && !disabled() && !readonly()"
  [focussable]="!disabled()"
  [separator]="separator()"
  [loading]="loading()"
  [virtual]="virtual()"
  [itemHeight]="itemHeight()"
  [multiple]="multiple()"
  [checkbox]="checkbox()"
  [label]="label()"
  [labelledBy]="labelledBy()"
  [value]="value()"
  [templateEmpty]="emptyTemplate() ?? defaultEmptyTemplate"
  [inputId]="inputId() + '_listbox'"
  (valueChange)="value.set($event)"
  (itemClicked)="itemClicked.emit($event)"
/>

<ng-template #defaultEmptyTemplate>
  <div [ptInt]="this" [ptClass]="'empty'">
    <span>{{ i18n['listBox_noItemsFound']() }}</span>
    @if (filtersActive()) {
      <div [ptInt]="this" [ptClass]="'empty-actions'">
        <button
          type="button"
          jigButton
          kind="secondary"
          [ptInt]="this"
          [ptDep]="'clear-all-button'"
          (click)="clearFilters()"
        >
          {{ i18n['filterListBox_clearAllFilters']() }}
        </button>
      </div>
    }
  </div>
</ng-template>
