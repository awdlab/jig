@if (visible()) {
  <span [ptInt]="this" [ptClass]="'indicator'">
    @switch (appliedKind()) {
      @case ('loading') {
        @defer (on immediate) {
          <ngn-spinner
            [ptInt]="this"
            [ptDep]="'spinner'"
            [size]="size()"
            [thickness]="thickness()"
          />
        }
      }
      @default {
        @if (icon() || defaultIcon()) {
          <ngn-icon [ptInt]="this" [ptDep]="'icon'" [defaultIcon]="defaultIcon()" [icon]="icon()" />
        }
      }
    }
  </span>
}
