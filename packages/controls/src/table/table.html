<table
  #scrollContainer
  ngnScrollShadow="horizontal"
  [ptInt]="this"
  [ptClass]="{ table: true, striped: striped() }"
  [attr.aria-rowcount]="formattedRows().length"
  [style.--ngn-table-column-count]="totalColumnCount()"
  [style.--ngn-table-selection-offset]="showCheckboxes() ? 1 : 0"
  [style.grid-template-columns]="gridTemplateColumns()"
  [style.--ngn-table-row-height.px]="rowHeight()"
>
  <thead [ptInt]="this" [ptClass]="'head'">
    <ng-container [ngTemplateOutlet]="headerTemplate()"></ng-container>
  </thead>
  @if (dropIndicatorState()) {
    <div
      [ptInt]="this"
      [ptClass]="'drop-indicator'"
      [style.left.px]="dropIndicatorState()!.leftPx"
      [style.top.px]="dropIndicatorState()!.topPx"
      [style.height.px]="dropIndicatorState()!.heightPx"
    ></div>
  }

  <tbody
    [ptInt]="this"
    [ptClass]="'body'"
    ngn-scroller
    #scroller
    [scrollContainer]="scrollContainer"
    [virtual]="virtual()"
    [items]="pagedRows()"
    [fieldId]="'id'"
    [itemHeight]="rowHeight() || 0"
    [virtualPadding]="virtualPadding()"
    [style.--ngn-table-item-start-index]="scroller.itemStartIndex()"
  >
    <ng-template #item [ngnTemplate]="scroller.templateTypes.item" let-item let-index="index">
      @if (item.kind === 'group-header') {
        @if (groupHeaderTemplate(); as customGroupHeader) {
          <ng-container
            [ngTemplateOutlet]="customGroupHeader"
            [ngTemplateOutletContext]="{
              $implicit: {
                groupKey: item.groupKey,
                groupValue: item.groupValue,
                count: item.count,
                expanded: item.expanded,
              },
            }"
          ></ng-container>
        } @else {
          <tr
            [ngnTableGroupHeaderTr]="item"
            [class]="theme.classes({ 'group-expanded': item.expanded })"
            [attr.aria-expanded]="item.expanded"
            role="row"
            (click)="toggleGroupFromRow(item)"
          >
            <td [class]="theme.class('group-header-cell')" role="gridcell">
              <ngn-icon
                [defaultIcon]="'table-group-toggle'"
                [class]="theme.class('group-toggle')"
              />
              <span>{{ item.groupValue }}</span>
              <span>({{ item.count }})</span>
            </td>
          </tr>
        }
      } @else {
        <ng-container
          [ngTemplateOutlet]="bodyTemplate()"
          [ngTemplateOutletContext]="{ $implicit: item }"
        ></ng-container>
      }
    </ng-template>
  </tbody>
</table>
@if (paginator()) {
  <ngn-paginator [totalItems]="rows().length" (value)="pageChanged($event)" />
}
