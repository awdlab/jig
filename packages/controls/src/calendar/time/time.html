<div>
  @if (isTouchDevice) {
    <ngn-input-field>
      <input
        type="time"
        ngnInput
        [step]="showSeconds() ? 1 : 60"
        [value]="value()"
        (valueChange)="onValueChange($event || '')"
      />
    </ngn-input-field>
  } @else {
    <ngn-input-field>
      <ngn-input-mask
        [mask]="mask()"
        [value]="value()"
        (valueChange)="onValueChange($event ?? '')"
      />
    </ngn-input-field>
  }
</div>
