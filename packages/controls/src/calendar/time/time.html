<div>
  @if (isTouchDevice) {
    <ngn-input-field>
      <input
        type="time"
        ngnInput
        [step]="showSeconds() ? 1 : 60"
        [value]="value()"
        (valueChange)="onValueChange($event || '')"
      />
    </ngn-input-field>
  } @else {
    <ngn-input-field>
      <ngn-input-mask [mask]="mask()">
        <input
          #input
          ngnInput
          type="text"
          [value]="value()"
          (blur)="onValueChange(input.value || '')"
        />
      </ngn-input-mask>
    </ngn-input-field>
  }
</div>
