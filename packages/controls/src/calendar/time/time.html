<div>
  @if (isTouchDevice) {
    <jig-input-field>
      <input
        type="time"
        jigInput
        [step]="showSeconds() ? 1 : 60"
        [value]="value()"
        (valueChange)="onValueChange($event || '')"
      />
    </jig-input-field>
  } @else {
    <jig-input-field>
      <jig-mask-input
        [mask]="mask()"
        [value]="value()"
        (valueChange)="onValueChange($event ?? '')"
      />
    </jig-input-field>
  }
</div>
