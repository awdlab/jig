<div>
  @if (isMobile) {
    <ngn-input-field>
      <input
        type="time"
        ngnInput
        [step]="showSeconds() ? 1 : 60"
        [ngModel]="value()"
        (ngModelChange)="onValueChange($event)"
      />
    </ngn-input-field>
  } @else {
    <ngn-input-mask [mask]="mask()">
      <input
        #input
        ngnInput
        type="text"
        [ngModel]="value()"
        (blur)="onValueChange(input.value || '')"
      />
    </ngn-input-mask>
  }
</div>
