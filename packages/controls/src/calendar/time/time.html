<div>
  @if (isTouchDevice) {
    <input
      type="time"
      ngnInput
      [step]="showSeconds() ? 1 : 60"
      [ngModel]="value()"
      (ngModelChange)="onValueChange($event)"
    />
  } @else {
    <ngn-input-mask [mask]="mask()">
      <input
        #input
        ngnInput
        type="text"
        [ngModel]="value()"
        (blur)="onValueChange(input.value || '')"
      />
    </ngn-input-mask>
  }
</div>
