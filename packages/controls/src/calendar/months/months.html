<div [ngClass]="theme.class('details')">
  <div [ngClass]="theme.class('navigation')">
    <button [ngClass]="theme.class('previous')" (click)="prev()"><</button>
    <span [ngClass]="theme.class('year')">{{ year() }}</span>
    <button [ngClass]="theme.class('next')" (click)="next()">></button>
  </div>
  <div [ngClass]="theme.class('months')">
    @for (month of months; track $index) {
      <button [ngClass]="theme.class('month')" (click)="selectMonth($index)">
        <ng-container
          *ngTemplateOutlet="
            monthTemplate();
            context: {
              $implicit: {
                month: month,
                selected: currentValue()?.getMonth() === $index,
              },
            }
          "
        >
          {{ month }}
        </ng-container>
      </button>
    }
  </div>
</div>
