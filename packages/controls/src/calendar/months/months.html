<div [ngClass]="theme.class('details')">
  <div [ngClass]="theme.class('header')">
    <div [ngClass]="theme.class('navigation')">
      <button ngnButton [kind]="'icon'" [ngClass]="theme.class('previous')" (click)="prev()">
        <ngn-icon [defaultIcon]="'fa-solid fa-chevron-left'" />
      </button>
      <button ngnButton [kind]="'icon'" [ngClass]="theme.class('next')" (click)="next()">
        <ngn-icon [defaultIcon]="'fa-solid fa-chevron-right'" />
      </button>
    </div>
    <input
      ngnInput
      [ngModel]="year()"
      (ngModelChange)="selectYear($event)"
      [ngClass]="theme.class('year')"
      type="number"
      pattern="[0-9]*"
      aria-label="Select year"
    />
  </div>
  <div [ngClass]="theme.class('months')">
    @for (month of months; track $index) {
      <button [ngClass]="theme.class('month')" (click)="selectMonth($index)">
        <ng-container
          *ngTemplateOutlet="
            monthTemplate();
            context: {
              $implicit: {
                month: month,
                selected: currentValue()?.getMonth() === $index,
              },
            }
          "
        >
          {{ month }}
        </ng-container>
      </button>
    }
  </div>
</div>
