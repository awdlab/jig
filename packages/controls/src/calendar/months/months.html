<div>
  <button (click)="prev()"><</button>
  <span>{{ year() }}</span>
  <button (click)="next()">></button>
  <div class="ngn-calendar-months">
    @for (month of months; track $index) {
      <button class="ngn-calendar-month" (click)="selectMonth($index)">
        <ng-container
          *ngTemplateOutlet="
            monthTemplate();
            context: {
              $implicit: {
                month: month,
                selected: currentValue()?.getMonth() === $index,
              },
            }
          "
        >
          {{ month }}
        </ng-container>
      </button>
    }
  </div>
</div>
