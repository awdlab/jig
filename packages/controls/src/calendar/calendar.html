@if (inline()) {
  <ng-container *ngTemplateOutlet="calendar"></ng-container>
} @else {
  <div
    #field
    [ptInt]="this"
    [ptClass]="{ 'input-field': true, invalid: invalidState() }"
    [attr.aria-invalid]="invalidState() ? 'true' : null"
    (click)="focusFromPointer($event)"
    (keydown)="onKeyDown($event)"
    (focusout)="potentiallyBlurred()"
    [tabindex]="disabled() ? -1 : 0"
  >
    <jig-mask-input
      [ptInt]="this"
      [ptDep]="'input'"
      [label]="i18n['calendar_input']()"
      [mask]="maskCfg()"
      [invalid]="invalidState()"
      [invalidOn]="'immediate'"
      [value]="valueStr()"
      (valueChange)="stringValueChange($event)"
      [disabled]="disabled()"
      [readonly]="readonly()"
    />
    <jig-icon defaultIcon="calendar-trigger" [ptInt]="this" [ptDep]="'trigger-icon'" />
  </div>
  <jig-popover
    #popover
    [ptInt]="this"
    [ptDep]="'popover'"
    [anchor]="anchorElement"
    [id]="inputId() + '_popover'"
    (closing)="potentiallyBlurred()"
  >
    <ng-template #lazy>
      <ng-container *ngTemplateOutlet="calendar"></ng-container>
    </ng-template>
  </jig-popover>
}

<ng-template #calendar>
  <div
    [ptInt]="this"
    [ptClass]="{
      root: true,
      inline: inline(),
    }"
  >
    <jig-calendar-days
      [component]="this"
      [theme]="theme"
      [year]="year()"
      [month]="month()"
      [currentValue]="value()"
      [firstDayOfWeek]="firstDayOfWeek()"
      (previousMonth)="previousMonth()"
      (nextMonth)="nextMonth()"
      (daySelected)="selectDay($event)"
      (monthSelected)="selectMonth($event)"
      (yearSelected)="selectYear($event)"
      (timeChanged)="changeTime($event)"
      [dayTemplate]="dayTemplate()"
      [weekDayTemplate]="weekDayTemplate()"
      [timeTemplate]="timeTemplate()"
      [yearTemplate]="yearTemplate()"
      [monthTemplate]="monthTemplate()"
      [showTime]="showTime()"
      [showSeconds]="showSeconds()"
      (focusout)="potentiallyBlurred()"
    />
  </div>
</ng-template>
<ng-template #defaultDayTemplate [jigTemplate]="templateTypes.day" let-day>
  {{ day.date }}
</ng-template>

<ng-template #defaultWeekDayTemplate [jigTemplate]="templateTypes.weekDay" let-weekDay>
  <span>
    {{ weekDay.translation }}
  </span>
</ng-template>

<ng-template #defaultTimeTemplate [jigTemplate]="templateTypes.time" let-time>
  @defer {
    <div [ptInt]="this" [ptClass]="'time'">
      <jig-calendar-time
        [component]="this"
        [currentValue]="time.time"
        [showSeconds]="time.showSeconds"
        (timeChange)="time.change($event)"
      />
    </div>
  }
</ng-template>

<ng-template #defaultYearTemplate [jigTemplate]="templateTypes.year" let-y>
  @defer {
    <jig-input-field [ptInt]="this" [ptDep]="'current-year-field'">
      <jig-select
        [ptInt]="this"
        [ptDep]="'current-year'"
        [editable]="true"
        [value]="year() + ''"
        (valueChange)="y.change(+($event || 0))"
        [options]="yearOptions"
        [virtual]="true"
        [itemHeight]="40"
        [popoverOptions]="{ sizeConstraints: { maxHeight: '300px' } }"
        [scrollToSelectedItemOnOpen]="'center'"
        [editableAutoFilter]="false"
      >
        <input jigInput type="number" [attr.aria-label]="i18n['calendar_selectYear']()" />
      </jig-select>
    </jig-input-field>
  }
</ng-template>

<ng-template #defaultMonthTemplate [jigTemplate]="templateTypes.month" let-m>
  @defer {
    <jig-input-field [ptInt]="this" [ptDep]="'current-month-field'">
      <jig-select
        [ptInt]="this"
        [ptDep]="'current-month'"
        [label]="i18n['calendar_selectMonth']()"
        [value]="m.month"
        (valueChange)="m.change($event!)"
        [options]="monthOptions()"
        [popoverOptions]="{
          sizeConstraints: { maxHeight: '300px', width: '130px', maxWidth: '130px' },
        }"
        [scrollToSelectedItemOnOpen]="'center'"
      />
    </jig-input-field>
  }
</ng-template>
