<div [ngClass]="theme.class()">
  @switch (currentView()) {
    @case ('days') {
      <ngn-calendar-days
        [year]="year()"
        [month]="month()"
        [currentValue]="value()"
        [firstDayOfWeek]="firstDayOfWeek()"
        (previousMonth)="previousMonth()"
        (nextMonth)="nextMonth()"
        (switchToMonthsView)="switchToView('months')"
        (daySelected)="selectDay($event)"
        (yearSelected)="selectYear($event)"
        (timeChanged)="changeTime($event)"
        [dayTemplate]="dayTemplate()"
        [weekDayTemplate]="weekDayTemplate()"
        [timeTemplate]="timeTemplate()"
        [yearTemplate]="yearTemplate()"
        [showTime]="showTime()"
        [showSeconds]="showSeconds()"
      />
    }
    @case ('months') {
      <ngn-calendar-months
        [year]="year()"
        [currentValue]="value() ?? null"
        (previousYear)="previousYear()"
        (nextYear)="nextYear()"
        (monthSelected)="selectMonth($event)"
        (yearSelected)="selectYear($event)"
        [monthTemplate]="monthTemplate()"
        [yearTemplate]="yearTemplate()"
      />
    }
  }
</div>

<ng-template #defaultDayTemplate [ngnTemplate]="templateTypes.day" let-day>
  {{ day.date }}
</ng-template>

<ng-template #defaultWeekDayTemplate [ngnTemplate]="templateTypes.weekDay" let-weekDay>
  <span>
    {{ weekDay.translation }}
  </span>
</ng-template>

<ng-template #defaultMonthTemplate [ngnTemplate]="templateTypes.month" let-month>
  <span [class.ngn-calendar-month-selected]="month.selected">
    {{ month.month }}
  </span>
</ng-template>

<ng-template #defaultTimeTemplate [ngnTemplate]="templateTypes.time" let-time>
  @defer {
    <ngn-calendar-time
      [currentValue]="time.time"
      [showSeconds]="time.showSeconds"
      (timeChange)="time.change($event)"
    />
  }
</ng-template>

<ng-template #defaultYearTemplate [ngnTemplate]="templateTypes.year" let-y>
  @defer {
    <ngn-select
      [editable]="true"
      [value]="year() + ''"
      (valueChange)="y.change(+($event || 0))"
      [options]="yearOptions"
      [virtual]="true"
      [itemHeight]="40"
      [popoverOptions]="{ sizeConstraints: { maxHeight: '300px' } }"
      [ngClass]="theme.class('current-year')"
    >
      <input ngnInput type="number" aria-label="Select year" />
    </ngn-select>
  }
</ng-template>
