@if (inline()) {
  <ng-container *ngTemplateOutlet="calendar"></ng-container>
} @else {
  <ngn-input-field
    #field
    [ngClass]="theme.class('input-field')"
    (click)="show()"
    (keydown)="onKeyDown($event)"
  >
    <input
      [ngClass]="theme.class('input')"
      ngnInput
      #input
      (valueChange)="stringValueChange($event)"
      [type]="showTime() ? 'datetime-local' : 'date'"
      [value]="valueStr()"
    />
    <ngn-icon defaultIcon="calendar" />
  </ngn-input-field>
  <ngn-popover #popover [anchor]="field.element.nativeElement" [id]="inputId() + '_popover'">
    <ng-template #lazy>
      <ng-container *ngTemplateOutlet="calendar"></ng-container>
    </ng-template>
  </ngn-popover>
}

<ng-template #calendar>
  <div
    [ngClass]="
      theme.classes({
        '': true,
        inline: inline(),
      })
    "
  >
    <ngn-calendar-days
      [theme]="theme"
      [year]="year()"
      [month]="month()"
      [currentValue]="value()"
      [firstDayOfWeek]="firstDayOfWeek()"
      (previousMonth)="previousMonth()"
      (nextMonth)="nextMonth()"
      (daySelected)="selectDay($event)"
      (monthSelected)="selectMonth($event)"
      (yearSelected)="selectYear($event)"
      (timeChanged)="changeTime($event)"
      [dayTemplate]="dayTemplate()"
      [weekDayTemplate]="weekDayTemplate()"
      [timeTemplate]="timeTemplate()"
      [yearTemplate]="yearTemplate()"
      [monthTemplate]="monthTemplate()"
      [showTime]="showTime()"
      [showSeconds]="showSeconds()"
    />
  </div>
</ng-template>
<ng-template #defaultDayTemplate [ngnTemplate]="templateTypes.day" let-day>
  {{ day.date }}
</ng-template>

<ng-template #defaultWeekDayTemplate [ngnTemplate]="templateTypes.weekDay" let-weekDay>
  <span>
    {{ weekDay.translation }}
  </span>
</ng-template>

<ng-template #defaultTimeTemplate [ngnTemplate]="templateTypes.time" let-time>
  @defer {
    <div [ngClass]="theme.class('time')">
      <ngn-calendar-time
        [currentValue]="time.time"
        [showSeconds]="time.showSeconds"
        (timeChange)="time.change($event)"
      />
    </div>
  }
</ng-template>

<ng-template #defaultYearTemplate [ngnTemplate]="templateTypes.year" let-y>
  @defer {
    <ngn-select
      [editable]="true"
      [value]="year() + ''"
      (valueChange)="y.change(+($event || 0))"
      [options]="yearOptions"
      [virtual]="true"
      [itemHeight]="40"
      [popoverOptions]="{ sizeConstraints: { maxHeight: '300px' } }"
      [ngClass]="theme.class('current-year')"
      [scrollToSelectedItemOnOpen]="'center'"
      [editableAutoFilter]="false"
      [tabindex]="-1"
    >
      <input ngnInput type="number" [attr.aria-label]="i18n['calendar_selectYear']()" />
    </ngn-select>
  }
</ng-template>

<ng-template #defaultMonthTemplate [ngnTemplate]="templateTypes.month" let-m>
  @defer {
    <ngn-select
      [value]="m.month"
      (valueChange)="m.change($event!)"
      [options]="monthOptions()"
      [popoverOptions]="{
        sizeConstraints: { maxHeight: '300px', width: '130px', maxWidth: '130px' },
      }"
      [ngClass]="theme.class('current-month')"
      [scrollToSelectedItemOnOpen]="'center'"
      [tabindex]="-1"
    />
  }
</ng-template>
