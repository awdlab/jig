<div [ptInt]="component()" [ptClass]="'details'">
  <div [ptInt]="component()" [ptClass]="'header'">
    <div [ptInt]="component()" [ptClass]="'navigation'">
      <button
        ngnButton
        [kind]="'icon'"
        [ptInt]="component()"
        [ptClass]="'previous'"
        (click)="prev()"
      >
        <ngn-icon [defaultIcon]="'chevron_left'" />
      </button>
      <button ngnButton [kind]="'icon'" [ptInt]="component()" [ptClass]="'next'" (click)="next()">
        <ngn-icon [defaultIcon]="'chevron_right'" />
      </button>
    </div>
    <ng-container
      *ngTemplateOutlet="
        monthTemplate();
        context: {
          $implicit: {
            month: MONTHS[month()],
            change: doMonthChange,
          },
        }
      "
    />

    <ng-container
      *ngTemplateOutlet="
        yearTemplate();
        context: {
          $implicit: {
            year: year(),
            change: doYearChange,
          },
        }
      "
    />
  </div>
  <div class="ngn-calendar-days">
    @for (weekDay of weekDaysSorted(); track weekDay) {
      <span [ptInt]="component()" [ptClass]="'week-day'">
        <ng-container
          *ngTemplateOutlet="
            weekDayTemplate();
            context: {
              $implicit: {
                weekDay: weekDay.weekDay,
                translation: weekDay.translation(),
              },
            }
          "
        />
      </span>
    }
    @for (item of monthModel().weeks; track $index) {
      @for (day of item.days; track $index) {
        <button
          #dayButton
          [ptInt]="component()"
          [ptClass]="{
            day: true,
            'day-other-month': day.monthOffset !== 0,
            'day-today':
              todaysMonth === month() + day.monthOffset &&
              todaysDay === day.date &&
              todaysYear === year(),
            'day-selected':
              currentValue()?.getDate() === day.date &&
              currentValue()?.getMonth() === month() + day.monthOffset &&
              currentValue()?.getFullYear() === year(),
          }"
          [tabIndex]="!day.monthOffset && tabFocusDay() === day.date ? 0 : -1"
          type="button"
          (click)="
            daySelected.emit({
              date: day.date,
              monthOffset: day.monthOffset,
            })
          "
          (keydown)="dayKeydown($event, dayButton)"
        >
          <ng-container
            *ngTemplateOutlet="
              dayTemplate();
              context: {
                $implicit: {
                  date: day.date,
                  fromOtherMonth: day.monthOffset !== 0,
                  selected:
                    currentValue()?.getDate() === day.date &&
                    currentValue()?.getMonth() === month() + day.monthOffset &&
                    currentValue()?.getFullYear() === year(),
                  today:
                    todaysMonth === month() + day.monthOffset &&
                    todaysDay === day.date &&
                    todaysYear === year(),
                },
              }
            "
          />
        </button>
      }
    }
  </div>
  @if (showTime()) {
    <ng-container
      *ngTemplateOutlet="
        timeTemplate();
        context: {
          $implicit: { time: currentValue(), showSeconds: showSeconds(), change: doTimeChange },
        }
      "
    />
  }
</div>
