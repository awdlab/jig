<div [ngClass]="theme.class('details')">
  <div [ngClass]="theme.class('header')">
    <div [ngClass]="theme.class('navigation')">
      <button ngnButton [kind]="'icon'" [ngClass]="theme.class('previous')" (click)="prev()">
        <ngn-icon [defaultIcon]="'fa-solid fa-chevron-left'" />
      </button>
      <button ngnButton [kind]="'icon'" [ngClass]="theme.class('next')" (click)="next()">
        <ngn-icon [defaultIcon]="'fa-solid fa-chevron-right'" />
      </button>
    </div>
    <button
      ngnButton
      kind="text"
      [ngClass]="theme.class('month')"
      (click)="switchToMonthsView.emit()"
    >
      {{ monthName() }}
    </button>
    <input
      ngnInput
      [ngModel]="year()"
      (ngModelChange)="selectYear($event)"
      [ngModelOptions]="{ updateOn: 'blur' }"
      [ngClass]="theme.class('year')"
      type="number"
      pattern="[0-9]*"
      aria-label="Select year"
    />
  </div>
  <div class="ngn-calendar-days">
    @for (weekDay of weekDaysSorted(); track $index) {
      <span [ngClass]="theme.class('week-day')">
        <ng-container
          *ngTemplateOutlet="
            weekDayTemplate();
            context: {
              $implicit: {
                weekDay: weekDay.weekDay,
                translation: weekDay.translation(),
              },
            }
          "
        />
      </span>
    }
    @for (item of monthModel().weeks; track $index) {
      @for (day of item.days; track $index) {
        <button
          [ngClass]="
            theme.classes({
              day: true,
              'day-other-month': day.monthOffset !== 0,
              'day-today':
                todaysMonth === month() + day.monthOffset &&
                todaysDay === day.date &&
                todaysYear === year(),
              'day-selected':
                currentValue()?.getDate() === day.date &&
                currentValue()?.getMonth() === month() + day.monthOffset &&
                currentValue()?.getFullYear() === year(),
            })
          "
          (click)="
            daySelected.emit({
              date: day.date,
              monthOffset: day.monthOffset,
            })
          "
        >
          <ng-container
            *ngTemplateOutlet="
              dayTemplate();
              context: {
                $implicit: {
                  date: day.date,
                  fromOtherMonth: day.monthOffset !== 0,
                  selected:
                    currentValue()?.getDate() === day.date &&
                    currentValue()?.getMonth() === month() + day.monthOffset &&
                    currentValue()?.getFullYear() === year(),
                  today:
                    todaysMonth === month() + day.monthOffset &&
                    todaysDay === day.date &&
                    todaysYear === year(),
                },
              }
            "
          />
        </button>
      }
    }
  </div>
  @if (showTime()) {
    <ng-container
      *ngTemplateOutlet="
        timeTemplate();
        context: {
          $implicit: { time: currentValue(), showSeconds: showSeconds(), change: doTimeChange },
        }
      "
    />
  }
</div>
