<div [ngClass]="theme.class('details')">
  <div [ngClass]="theme.class('navigation')">
    <button [ngClass]="theme.class('previous')" (click)="prev()"><</button>
    <button [ngClass]="theme.class('month')" (click)="switchToMonthsView.emit()">
      {{ monthName() }}
    </button>
    <button [ngClass]="theme.class('next')" (click)="next()">></button>
  </div>
  <div class="ngn-calendar-days">
    @for (weekDay of weekDaysSorted(); track $index) {
      <span [ngClass]="theme.class('week-day')">
        <ng-container
          *ngTemplateOutlet="
            weekDayTemplate();
            context: {
              $implicit: {
                weekDay: weekDay.weekDay,
                translation: weekDay.translation(),
              },
            }
          "
        />
      </span>
    }
    @for (item of monthModel().weeks; track $index) {
      @for (day of item.days; track $index) {
        <button
          [ngClass]="
            theme.classes({
              day: true,
              'day-other-month': day.monthOffset !== 0,
              'day-today': todaysMonth === month() + day.monthOffset && todaysDay === day.date,
              'day-selected':
                currentValue()?.getDate() === day.date &&
                currentValue()?.getMonth() === month() + day.monthOffset &&
                currentValue()?.getFullYear() === year(),
            })
          "
          (click)="
            daySelected.emit({
              date: day.date,
              monthOffset: day.monthOffset,
            })
          "
        >
          <ng-container
            *ngTemplateOutlet="
              dayTemplate();
              context: {
                $implicit: {
                  date: day.date,
                  fromOtherMonth: day.monthOffset !== 0,
                  selected:
                    currentValue()?.getDate() === day.date &&
                    currentValue()?.getMonth() === month() + day.monthOffset &&
                    currentValue()?.getFullYear() === year(),
                  today: todaysMonth === month() + day.monthOffset && todaysDay === day.date,
                },
              }
            "
          />
        </button>
      }
    }
  </div>
  <ng-container
    *ngTemplateOutlet="
      timeTemplate();
      context: { $implicit: { time: currentValue(), showSeconds: showSeconds() } }
    "
  />
</div>
