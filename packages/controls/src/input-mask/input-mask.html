<ngn-input-field [label]="label()" [inputId]="inputId()">
  <div [ngClass]="theme.class()">
    <ng-content />
    <!-- <input
      [ngClass]="theme.class('input')"
      (input)="onInput($event)"
      (keydown)="onKeyDown($event)"
      (beforeinput)="onBeforeInput($event)"
    /> -->
    <span [ngClass]="theme.class('mask')">
      <span [ngClass]="theme.class('mask-placeholder')" aria-hidden="true" style="opacity: 0">{{
        currentInputValue()
      }}</span>
      <span [ngClass]="theme.class('mask-text')">{{ maskWatermark() }}</span>
    </span>
  </div>
</ngn-input-field>
