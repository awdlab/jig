<div [ptInt]="this" [ptClass]="'root'">
  <ng-content />
  <span [ptInt]="this" [ptClass]="'mask'">
    <span [ptInt]="this" [ptClass]="'mask-placeholder'" aria-hidden="true" style="opacity: 0">{{
      currentInputValue()
    }}</span>
    <span [ptInt]="this" [ptClass]="'mask-text'">{{ maskWatermark() }}</span>
  </span>
</div>
