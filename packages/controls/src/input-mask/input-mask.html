<div [ptInt]="this" [ptClass]="'root'">
  <ng-content />
  <span [ptInt]="this" [ptClass]="'mask'">
    <span [ptInt]="this" [ptClass]="'mask-placeholder'" aria-hidden="true" style="opacity: 0">{{
      currentInputValue()
    }}</span>
    <span [ptInt]="this" [ptClass]="'mask-text'">{{ maskWatermark() }}</span>
  </span>
  @for (seg of segmentDescriptions(); track seg.id) {
    <span [id]="seg.id" [ptInt]="this" [ptClass]="'sr-only'">{{ seg.text }}</span>
  }
  @if (hasSegments()) {
    <span aria-live="polite" [ptInt]="this" [ptClass]="'sr-only'">{{ liveAnnouncement() }}</span>
  }
</div>
