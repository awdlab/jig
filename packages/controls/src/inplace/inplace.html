@if (contentVisible()) {
  <div [ptInt]="this" [ptClass]="'content'">
    <ngn-defer
      [open]="contentVisible()"
      [lazyContent]="contentTemplate()"
      [lazyContentContext]="templateContentContext() ?? { $implicit: { close: closeContent } }"
      [lazy]="lazy()"
      [cache]="cache()"
    />
  </div>
} @else {
  <button [ptInt]="this" [ptClass]="'display'" role="button" (click)="switchToContent()">
    <ng-container
      [ngTemplateOutlet]="displayTemplate()"
      [ngTemplateOutletContext]="templateDisplayContext()"
    />
  </button>
}
