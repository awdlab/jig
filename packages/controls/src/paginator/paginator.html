<button
  jigButton
  [kind]="'icon'"
  [ptInt]="this"
  [ptDep]="'previous'"
  [disabled]="page() === 0"
  [attr.aria-label]="i18n['paginator_previousPage']()"
  (click)="previousPage($event)"
>
  <jig-icon [defaultIcon]="'paginator-previous'" />
</button>

@if (mode() === 'pages') {
  <!-- Roving focus: the current page is the only tab stop, the arrow keys move along the row. -->
  <jig-item-view
    #itemView
    (keydown)="onPagesKeydown($event)"
    [ptInt]="this"
    [ptDep]="'item-view'"
    [items]="pages()"
    [idField]="'page'"
    [overflowStrategy]="'aroundIndex'"
    [overflowStrategyFreezeCount]="1"
    [overflowStrategyIndex]="page()"
    [sameWidthItems]="true"
  >
    <ng-template #item let-item [jigTemplate]="itemView.templateTypes.item">
      @let buttonStyles = getButtonFontStyles(item.page);
      <button
        jigButton
        [kind]="'icon'"
        [ptInt]="this"
        [ptDep]="'page-number'"
        [ngStyle]="buttonStyles"
        [tabindex]="page() === item.page ? 0 : -1"
        [attr.aria-current]="page() === item.page ? 'page' : null"
        [ngClass]="
          theme.classes({
            'active-page': page() === item.page,
          })
        "
        (click)="page.set(item.page)"
      >
        {{ item.page + 1 }}
      </button>
    </ng-template>
    <ng-template #overflow let-item [jigTemplate]="itemView.templateTypes.overflow">
      <button
        jigButton
        [kind]="'icon'"
        [ptInt]="this"
        [ptDep]="'overflow'"
        style="opacity: 0.5"
        disabled
      >
        ...
      </button>
    </ng-template>
  </jig-item-view>
}

@if (mode() === 'compact') {
  <span data-compact-page aria-current="page">{{ page() + 1 }}</span>
}

<button
  jigButton
  [kind]="'icon'"
  [ptInt]="this"
  [ptDep]="'next'"
  [disabled]="mode() === 'compact' && !hasNext()"
  [attr.aria-label]="i18n['paginator_nextPage']()"
  (click)="nextPage($event)"
>
  <jig-icon [defaultIcon]="'paginator-next'" />
</button>

@if (!fixedPageSize()) {
  <jig-input-field [ptInt]="this" [ptClass]="'page-size-options'">
    <jig-select
      [options]="pageSizeOptions()"
      [value]="appliedPageSize()"
      (valueChange)="pageSize.set($event)"
    />
  </jig-input-field>
}
