<button
  ngnButton
  [kind]="'icon'"
  [ptInt]="this"
  [ptDep]="'previous'"
  [attr.aria-label]="i18n['paginator_previousPage']()"
  (click)="previousPage($event)"
>
  <ngn-icon [defaultIcon]="'paginator-previous'" />
</button>

<ngn-item-view
  #itemView
  [ptInt]="this"
  [ptDep]="'item-view'"
  [items]="pages()"
  [idField]="'page'"
  [overflowStrategy]="'aroundIndex'"
  [overflowStrategyFreezeCount]="1"
  [overflowStrategyIndex]="page()"
  [sameWidthItems]="true"
>
  <ng-template #item let-item [ngnTemplate]="itemView.templateTypes.item">
    @let buttonStyles = getButtonFontStyles(item.page);
    <button
      ngnButton
      [kind]="'icon'"
      [ptInt]="this"
      [ptDep]="'page-number'"
      [ngStyle]="buttonStyles"
      [attr.aria-current]="page() === item.page ? 'page' : null"
      [ngClass]="
        theme.classes({
          'active-page': page() === item.page,
        })
      "
      (click)="page.set(item.page)"
    >
      {{ item.page + 1 }}
    </button>
  </ng-template>
  <ng-template #overflow let-item [ngnTemplate]="itemView.templateTypes.overflow">
    <button
      ngnButton
      [kind]="'icon'"
      [ptInt]="this"
      [ptDep]="'overflow'"
      style="opacity: 0.5"
      disabled
    >
      ...
    </button>
  </ng-template>
</ngn-item-view>

<button
  ngnButton
  [kind]="'icon'"
  [ptInt]="this"
  [ptDep]="'next'"
  [attr.aria-label]="i18n['paginator_nextPage']()"
  (click)="nextPage($event)"
>
  <ngn-icon [defaultIcon]="'paginator-next'" />
</button>

@if (!fixedPageSize()) {
  <ngn-input-field [ptInt]="this" [ptClass]="'page-size-options'">
    <ngn-select
      [options]="pageSizeOptions()"
      [value]="appliedPageSize()"
      (valueChange)="pageSize.set($event)"
    />
  </ngn-input-field>
}
