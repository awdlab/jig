<button ngnButton [kind]="'icon'" (click)="previousPage($event)">
  <ngn-icon [defaultIcon]="'chevron_left'" />
</button>

<ngn-item-view
  #itemView
  [items]="pages()"
  [idField]="'page'"
  [overflowStrategy]="'aroundIndex'"
  [overflowStrategyFreezeCount]="1"
  [overflowStrategyIndex]="page()"
  [sameWidthItems]="true"
>
  <ng-template #item let-item [ngnTemplate]="itemView.templateTypes.item">
    @let buttonStyles = getButtonFontStyles(item.page);
    <button
      ngnButton
      [kind]="'icon'"
      [ngStyle]="buttonStyles"
      [style.background]="page() === item.page ? 'var(--ngn-color-secondary-500)' : null"
      (click)="page.set(item.page)"
    >
      {{ item.page + 1 }}
    </button>
  </ng-template>
  <ng-template #overflow let-item [ngnTemplate]="itemView.templateTypes.overflow">
    <button ngnButton [kind]="'icon'" style="opacity: 0.5" disabled>...</button>
  </ng-template>
</ngn-item-view>

<button ngnButton [kind]="'icon'" (click)="nextPage($event)">
  <ngn-icon [defaultIcon]="'chevron_right'" />
</button>

@if (!fixedPageSize()) {
  <ngn-select
    [ngClass]="theme.class('page-size-options')"
    [options]="pageSizeOptions()"
    [value]="appliedPageSize()"
    (valueChange)="pageSize.set($event)"
  />
}
