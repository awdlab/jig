@if (actionable()) {
  <button type="button" [ptInt]="this" [ptClass]="'content'" (click)="clicked.emit($event)">
    <ng-container *ngTemplateOutlet="content"></ng-container>
  </button>
} @else {
  <div [ptInt]="this" [ptClass]="'content'">
    <ng-container *ngTemplateOutlet="content"></ng-container>
  </div>
}

@if (closable()) {
  <button type="button" [ptInt]="this" [ptClass]="'close-button'" (click)="closed.emit($event)">
    <ngn-icon
      [ptInt]="this"
      [ptClass]="'close-icon'"
      [icon]="iconClose()"
      [defaultIcon]="'xmark'"
    />
  </button>
}

<ng-template #content>
  <ng-content />
</ng-template>
