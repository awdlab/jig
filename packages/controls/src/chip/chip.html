@if (actionable()) {
  <button type="button" [ngClass]="theme.class('content')" (click)="clicked.emit($event)">
    <ng-container *ngTemplateOutlet="content"></ng-container>
  </button>
} @else {
  <div [ngClass]="theme.class('content')">
    <ng-container *ngTemplateOutlet="content"></ng-container>
  </div>
}

@if (closable()) {
  <button type="button" [ngClass]="theme.class('close-button')" (click)="closed.emit($event)">
    <ngn-icon [ngClass]="theme.class('close-icon')" [icon]="iconClose()" [defaultIcon]="'xmark'" />
  </button>
}

<ng-template #content>
  <ng-content />
</ng-template>
