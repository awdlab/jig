<!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events -->
<div
  [ngClass]="
    theme.classes({
      '': !hasParentInputfield,
      invalid: invalid(),
    })
  "
  (click)="clicked($event)"
  [tabindex]="tabindex()"
>
  @if (label(); as label) {
    <label [ngClass]="theme.class('label')" [for]="inputId()">{{ label }}</label>
  }
  <ng-content />
</div>
