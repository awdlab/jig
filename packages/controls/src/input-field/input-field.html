@if (label(); as label) {
  <!-- Hugged tags keep the marker glued to the label text — the label is `white-space: pre`. -->
  <!-- prettier-ignore -->
  <label [ptInt]="this" [ptClass]="'label'" [for]="inputId()">{{ label }}@if (requiredMarker()) {<span [ptInt]="this" [ptClass]="'required-marker'" aria-hidden="true"></span>}</label>
}
<!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events -->
<div
  [ptInt]="this"
  [ptClass]="{
    root: true,
    invalid: invalid(),
    readonly: readonly(),
    disabled: disabled(),
  }"
  (click)="clicked($event)"
  [tabindex]="tabindex()"
>
  <ng-content select="input, textarea" />
  @if (showClearButton()) {
    <button
      tabindex="-1"
      [ptInt]="this"
      [ptClass]="'clear-button'"
      jigButton
      type="button"
      [kind]="'icon'"
      jigButtonInline
      (click)="clearButtonClicked($event)"
      [attr.aria-label]="i18n['inputField_clearInput']()"
    >
      <jig-icon defaultIcon="input-clear" [icon]="iconClearButton()" />
    </button>
  }
  <ng-content />
</div>
