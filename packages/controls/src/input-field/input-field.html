@if (label(); as label) {
  <label [ngClass]="theme.class('label')" [for]="inputId()">{{ label }}</label>
}
<!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events -->
<div
  [ngClass]="
    theme.classes({
      '': !hasParentInputfield,
      invalid: invalid(),
      readonly: readonly(),
      disabled: disabled(),
    })
  "
  (click)="clicked($event)"
  [tabindex]="tabindex()"
>
  <ng-content select="input, textarea" />
  @if (showClearButton()) {
    <button
      tabindex="-1"
      [ngClass]="theme.class('clear-button')"
      ngnButton
      type="button"
      [kind]="'icon'"
      inline
      (click)="clearButtonClicked($event)"
      [attr.aria-label]="i18n['inputField_clearInput']()"
    >
      <ngn-icon defaultIcon="xmark" [icon]="iconClearButton()" />
    </button>
  }
  <ng-content />
</div>
