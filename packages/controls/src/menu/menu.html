@if (popover()) {
  <ngn-popover
    [ngClass]="theme.class('popover')"
    [anchor]="anchor()"
    [options]="{ placement: placement(), padding: isSubMenu() ? 0 : undefined }"
    (closed)="popoverClosed.emit()"
  >
    <ng-template #lazy>
      <ng-container *ngTemplateOutlet="menu" />
    </ng-template>
  </ngn-popover>
} @else {
  <ng-container *ngTemplateOutlet="menu" />
}

<ng-template #menu>
  <div [ngClass]="theme.class()" role="menu">
    @for (item of items(); track item.id) {
      @if (item.children) {
        <button
          #menuItem
          role="menuitem"
          [tabindex]="$index === 0 ? 0 : -1"
          [ngnAutofocus]="autofocus() && $index === 0"
          [ngClass]="theme.classes({ item: true, 'item-disabled': item.disabled })"
          #itemButton
          (click)="childMenu.open()"
          (keydown)="handleKeydown($event, childMenu)"
        >
          <ng-container *ngTemplateOutlet="itemTemplate(); context: { $implicit: item }" />
        </button>
        <ngn-menu
          #childMenu
          [anchor]="itemButton"
          [items]="item.children"
          [placement]="'right-start'"
          [popover]="true"
          [isSubMenu]="true"
          (popoverClosed)="menuItem.focus()"
        />
      } @else {
        <button
          #menuItem
          role="menuitem"
          [tabindex]="$index === 0 ? 0 : -1"
          [ngnAutofocus]="autofocus() && $index === 0"
          [ngClass]="theme.classes({ item: true, 'item-disabled': item.disabled })"
          (keydown)="handleKeydown($event)"
        >
          <ng-container *ngTemplateOutlet="itemTemplate(); context: { $implicit: item }" />
        </button>
      }
    }
  </div>
</ng-template>

<ng-template #defaultItemTemplate [ngnTemplate]="templateTypes.item" let-item>
  {{ item.label }}
  @if (item.children) {
    <ngn-icon
      [ngClass]="theme.class('icon-children')"
      defaultIcon="fa-solid fa-caret-right"
      [icon]="iconChildren()"
    />
  }
</ng-template>

<ng-template #defaultGroupTemplate></ng-template>
