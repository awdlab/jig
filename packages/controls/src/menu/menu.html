@if (popover()) {
  <ngn-popover
    [ngClass]="theme.class('popover')"
    [anchor]="anchor()"
    [options]="{ placement: placement(), padding: isSubMenu() ? 0 : undefined }"
    (closed)="popoverClosed()"
  >
    <ng-template #lazy>
      <ng-container *ngTemplateOutlet="menu" />
    </ng-template>
  </ngn-popover>
} @else {
  <ng-container *ngTemplateOutlet="menu" />
}

<ng-template #menu>
  <div [ngClass]="theme.class()" role="menu" [tabIndex]="0">
    @for (item of items(); track item.id) {
      @if (item.children) {
        <button
          #menuItem
          role="menuitem"
          [tabindex]="-1"
          [ngnAutofocus]="autofocus() && $index === 0"
          [ngClass]="
            theme.classes({
              item: true,
              'item-disabled': item.disabled,
              'item-opened': childMenu.isOpen(),
            })
          "
          (click)="openChildMenu(childMenu, menuItem, 'click')"
          (mouseenter)="openChildMenu(childMenu, menuItem, 'hover')"
          (keydown)="handleKeydown($event, childMenu)"
        >
          <ng-container *ngTemplateOutlet="itemTemplate(); context: { $implicit: item }" />
        </button>
        <ngn-menu
          #childMenu
          [anchor]="menuItem"
          [items]="item.children"
          [placement]="'right-start'"
          [popover]="true"
          [isSubMenu]="true"
          (closed)="menuItem.focus()"
        />
      } @else {
        <button
          #menuItem
          role="menuitem"
          [tabindex]="-1"
          [ngnAutofocus]="autofocus() && $index === 0"
          [ngClass]="theme.classes({ item: true, 'item-disabled': item.disabled })"
          (keydown)="handleKeydown($event)"
          (mouseenter)="closeChildMenus('hover', menuItem)"
        >
          <ng-container *ngTemplateOutlet="itemTemplate(); context: { $implicit: item }" />
        </button>
      }
    }
  </div>
</ng-template>

<ng-template #defaultItemTemplate [ngnTemplate]="templateTypes.item" let-item>
  {{ item.label }}
  @if (item.children) {
    <ngn-icon
      [ngClass]="theme.class('icon-children')"
      defaultIcon="fa-solid fa-caret-right"
      [icon]="iconChildren()"
    />
  }
</ng-template>

<ng-template #defaultGroupTemplate></ng-template>
