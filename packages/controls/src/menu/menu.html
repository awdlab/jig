@if (popover() && anchor(); as anchor) {
  <ngn-popover
    [ptInt]="this"
    [ptClass]="'popover'"
    [anchor]="anchor"
    [options]="{ placement: placement(), padding: isSubMenu() ? 0 : undefined }"
    (openChange)="popoverOpenChange($event)"
    (closed)="popoverClosed()"
    (closing)="closing.emit()"
  >
    <ng-template #lazy>
      <ng-container *ngTemplateOutlet="menu" />
    </ng-template>
  </ngn-popover>
} @else {
  <ng-container *ngTemplateOutlet="menu" />
}

<ng-template #menu>
  <div [ptInt]="this" [ptClass]="'root'" role="menu" [tabIndex]="0" [id]="elementId() + '_menu'">
    @for (item of items(); track 'id' in item ? item.id : item) {
      @if ('separator' in item) {
        <ng-container *ngTemplateOutlet="separatorTemplate" />
      } @else {
        <ng-container
          *ngTemplateOutlet="regularItemTemplate; context: { $implicit: item, index: $index }"
        />
      }
    }
  </div>
</ng-template>

<ng-template #separatorTemplate>
  <hr [ptInt]="this" [ptClass]="'separator'" />
</ng-template>

<ng-template
  #regularItemTemplate
  [ngnTemplate]="internalTemplateTypes.regularItem"
  let-item
  let-index="index"
>
  @if (item.children) {
    <button
      #menuItem
      role="menuitem"
      aria-haspopup="menu"
      [aria-expanded]="childMenu.open()"
      [tabindex]="-1"
      [ngnAutofocus]="open() && autofocus() && index === 0"
      [ptInt]="this"
      [ptClass]="{
        item: true,
        'item-opened': childMenu.open(),
      }"
      [disabled]="item.disabled"
      (click)="openChildMenu(childMenu, menuItem, 'click')"
      (mouseenter)="openChildMenu(childMenu, menuItem, 'hover')"
      (keydown)="handleKeydown($event, childMenu)"
    >
      <ng-container *ngTemplateOutlet="itemTemplate(); context: { $implicit: item }" />
    </button>
    <ngn-menu
      #childMenu
      [anchor]="menuItem"
      [items]="item.children"
      [placement]="'right-start'"
      [popover]="true"
      [isSubMenu]="true"
      (closing)="menuItem.focus()"
      (closeAll)="doCloseAll()"
      [elementId]="elementId() + '_submenu_' + item.id"
      [openSubmenuOnHover]="openSubmenuOnHover()"
    />
  } @else {
    <button
      #menuItem
      role="menuitem"
      [tabindex]="-1"
      [ngnAutofocus]="open() && autofocus() && index === 0"
      [ptInt]="this"
      [ptClass]="'item'"
      [disabled]="item.disabled"
      (keydown)="handleKeydown($event)"
      (click)="itemClicked(item)"
      (mouseenter)="closeChildMenus('hover', menuItem)"
      [routerLink]="item.route"
    >
      <ng-container *ngTemplateOutlet="itemTemplate(); context: { $implicit: item }" />
    </button>
  }
</ng-template>

<ng-template #defaultItemTemplate [ngnTemplate]="templateTypes.item" let-item>
  {{ item.label }}
  @if (item.children) {
    <ngn-icon
      [ptInt]="this"
      [ptClass]="'icon-children'"
      defaultIcon="chevron_right"
      [icon]="iconSubmenuIndicator()"
    />
  }
</ng-template>

<ng-template #defaultGroupTemplate></ng-template>
