<jig-dialog
  [ptInt]="this"
  [ptDep]="'dialog'"
  [modal]="true"
  [closeButton]="false"
  [label]="labelText()"
  [(open)]="open"
  [closeBy]="closeBy()"
  [size]="size()"
  [jigKeyboardShortcut]="shortcutBindings()"
>
  <jig-input-field [ptInt]="this" [ptDep]="'search'">
    <jig-icon [ptInt]="this" [ptClass]="'search-icon'" [icon]="iconSearch()" defaultIcon="search" />
    <input
      #searchInput
      jigInput
      role="combobox"
      aria-haspopup="listbox"
      aria-expanded="true"
      autocomplete="off"
      [attr.aria-controls]="listBoxId"
      [attr.aria-activedescendant]="activeDescendantId()"
      [attr.aria-label]="placeholderText()"
      [placeholder]="placeholderText()"
      [value]="filterText()"
      (valueChange)="filterText.set($event ?? '')"
      (keydown)="onKeyDown($event)"
    />
  </jig-input-field>

  <jig-list-box
    [ptInt]="this"
    [ptDep]="'list-box'"
    [inputId]="listBoxId"
    [label]="labelText()"
    [focussable]="false"
    [selectable]="true"
    [separator]="true"
    [items]="mappedItems()"
    [filter]="filter()"
    [filterText]="filterText()"
    [templateItem]="itemTemplate()"
    [templateGroup]="groupTemplate()"
    [templateEmpty]="emptyTemplate()"
    (itemClicked)="onItemClicked($event)"
  />

  <ng-template #footer>
    <div [ptInt]="this" [ptClass]="'hints'">
      <span [ptInt]="this" [ptClass]="'hint'">
        <jig-kbd shortcut="escape" aria-hidden="true" />
        {{ i18n['command_hintClose']() }}
      </span>
      <span [ptInt]="this" [ptClass]="'hint'">
        <jig-kbd shortcut="arrowup" aria-hidden="true" />
        <jig-kbd shortcut="arrowdown" aria-hidden="true" />
        {{ i18n['command_hintSelect']() }}
      </span>
      <span [ptInt]="this" [ptClass]="'hint'">
        <jig-kbd shortcut="enter" aria-hidden="true" />
        {{ i18n['command_hintConfirm']() }}
      </span>
    </div>
  </ng-template>
</jig-dialog>

<ng-template #defaultItemTemplate [jigTemplate]="templateTypes.item" let-item>
  <span [ptInt]="this" [ptClass]="'item'" [attr.data-testid]="item?.testId">
    @if (item?.icon; as icon) {
      <jig-icon [ptInt]="this" [ptClass]="'item-icon'" [icon]="icon" />
    }
    <span [ptInt]="this" [ptClass]="'item-label'">{{ maybeCallback(item?.label) }}</span>
    @if (item?.data?.shortcut; as shortcut) {
      <jig-kbd
        [ptInt]="this"
        [ptClass]="'item-shortcut'"
        [shortcut]="shortcut"
        aria-hidden="true"
      />
    }
  </span>
</ng-template>

<ng-template #defaultEmptyTemplate>
  <span [ptInt]="this" [ptClass]="'empty'" [attr.data-testid]="'empty'">{{
    i18n['command_noResults']()
  }}</span>
</ng-template>
