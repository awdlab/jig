@for (item of items(); track item; let i = $index) {
  <span
    role="listitem"
    #item
    [ngClass]="
      theme.classes({
        item: true,
        'item-overflowing': !visibleItemIndices().includes(i),
      })
    "
    [ariaHidden]="!visibleItemIndices().includes(i)"
  >
    <ng-container
      *ngTemplateOutlet="
        itemTemplate();
        context: { $implicit: item, index: i, last: $last, first: $first }
      "
    />
    @if (!$last) {
      <ng-container
        *ngTemplateOutlet="
          separatorTemplate();
          context: { $implicit: { character: separatorChar(), icon: separatorIcon() } }
        "
      />
    }
  </span>

  @if (i === overflowItemIndex()) {
    <div #overflowItem>
      <span [ngClass]="theme.class('more-items')">+{{ moreItemsCount() }}</span>
      @if (overflowStrategy() !== 'end') {
        <span
          [ngClass]="
            theme.classes({
              item: true,
              'hidden-separator': !hasRenderedItemAfterOverflowItem(),
            })
          "
        >
          <ng-container
            *ngTemplateOutlet="
              separatorTemplate();
              context: { $implicit: { character: separatorChar(), icon: separatorIcon() } }
            "
        /></span>
      }
    </div>
  }
}

<ng-template #defaultSeparatorTemplate [ngnTemplate]="templateTypes.separator" let-separator>
  @if (separator.character) {
    <span>{{ separator.character }}</span>
  } @else if (separator.icon) {
    <ngn-icon [icon]="separator.icon" />
  }
</ng-template>
