@for (item of items(); track item; let i = $index) {
  <span
    role="listitem"
    #item
    [ngClass]="
      theme.classes({
        item: true,
        'item-overflowing': i >= visibleItemCount(),
      })
    "
    [ariaHidden]="i >= visibleItemCount()"
  >
    <ng-container *ngTemplateOutlet="itemTemplate(); context: { $implicit: item, index: i }" />
    @if (!$last && separatorChar(); as separatorChar) {
      <span>{{ separatorChar }}</span>
    }
  </span>
}
@if (moreItemsCount()) {
  <div #overflowItem [ngClass]="theme.class('more-items')">+{{ moreItemsCount() }}</div>
}
