@for (item of items(); track item[idField()]; let i = $index) {
  <span
    role="listitem"
    #item
    [ngClass]="
      theme.classes({
        item: true,
        'item-overflowing': !visibleItemIndices().includes(i),
      })
    "
  >
    <ng-container
      *ngTemplateOutlet="
        itemTemplate();
        context: { $implicit: item, index: i, last: $last, first: $first }
      "
    />
    @if (!$last) {
      <ng-container
        *ngTemplateOutlet="
          separatorTemplate();
          context: { $implicit: { character: separatorChar(), icon: iconItemSeparator() } }
        "
      />
    }
  </span>

  @if (i === overflowItemIndex()) {
    <div [ngClass]="theme.class('more-items')" aria-hidden="true" #overflowItem>
      <ng-container
        *ngTemplateOutlet="
          overflowTemplate();
          context: {
            $implicit: {
              totalCount: items().length,
              overflowCount: moreItemsCount(),
              overflowItems: overflowingItems(),
            },
          }
        "
      />
      @if (overflowStrategy() !== 'end') {
        <span
          [ngClass]="
            theme.classes({
              item: true,
              'hidden-separator': !hasRenderedItemAfterOverflowItem(),
            })
          "
        >
          <ng-container
            *ngTemplateOutlet="
              separatorTemplate();
              context: { $implicit: { character: separatorChar(), icon: iconItemSeparator() } }
            "
        /></span>
      }
    </div>
  }
}

<ng-template #defaultSeparatorTemplate [ngnTemplate]="templateTypes.separator" let-separator>
  @if (separator.character) {
    <span>{{ separator.character }}</span>
  } @else if (separator.icon) {
    <ngn-icon [icon]="separator.icon" />
  }
</ng-template>

<ng-template #defaultOverflowItemTemplate [ngnTemplate]="templateTypes.overflow" let-overflow>
  <span [ngClass]="theme.class('more-items-default')">+{{ overflow.overflowCount }}</span>
</ng-template>
