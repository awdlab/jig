<div [ngClass]="theme.classes({ track: true, 'track-checked': !!value() })">
  <div [ngClass]="theme.class('thumb')"></div>
</div>
<input
  type="checkbox"
  [checked]="value()"
  (change)="changed($event)"
  (click)="onClick($event)"
  [ngClass]="theme.class('input')"
  [attr.disabled]="disabled() ? '' : undefined"
  [ariaReadOnly]="readonly() ? '' : undefined"
  [ariaInvalid]="invalid() ? 'true' : undefined"
  [ariaLabelledByElements]="labelledBy()"
/>
