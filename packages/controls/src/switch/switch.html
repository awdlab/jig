<div [ptInt]="this" [ptClass]="{ track: true, 'track-checked': !!value() }">
  <div [ptInt]="this" [ptClass]="'thumb'"></div>
</div>
<input
  type="checkbox"
  [checked]="value()"
  (change)="changed($event)"
  (click)="onClick($event)"
  [ptInt]="this"
  [ptClass]="'input'"
  [attr.disabled]="disabled() ? '' : undefined"
  [ariaReadOnly]="readonly() ? '' : undefined"
  [ariaInvalid]="invalid() ? 'true' : undefined"
  [attr.aria-label]="label()"
  [ariaLabelledByElements]="labelledBy()"
  (blur)="touched.set(true)"
  [id]="inputId()"
/>
