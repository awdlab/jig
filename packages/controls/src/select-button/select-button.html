<ngn-button-group [orientation]="orientation()">
  @for (item of options(); track item.value) {
    <ngn-toggle-button
      [label]="typeof item.label === 'string' ? item.label : item.label()"
      [icon]="item.icon"
      [fixedWidth]="true"
      (valueChange)="valueChange(item.value)"
      [value]="value() === item.value"
      [readonly]="readonly() || (value() === item.value && !allowUnselect())"
      [attr.data-testid]="item.testId"
      [disabled]="disabled()"
      [ptInt]="this"
      [ptClass]="'button'"
    />
  }
</ngn-button-group>
