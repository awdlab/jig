<ngn-input-field
  [ngClass]="
    theme.classes({
      input: true,
      'input-editable': editable(),
    })
  "
  (click)="popover.open()"
  (keydown)="onKeyDown($event)"
  #field
  [label]="label()"
  [inputId]="inputId()"
  [tabindex]="0"
>
  @if (editable()) {
    <input ngnInput [ngModel]="value()" (ngModelChange)="onEditableChange($event)" />
  } @else {
    <ng-template
      [ngTemplateOutlet]="selectedItemTemplate()"
      [ngTemplateOutletContext]="{
        $implicit: selectedItem(),
      }"
    ></ng-template>
  }
</ngn-input-field>
<ngn-popover
  #popover
  [options]="appliedPopoverOptions()"
  [anchor]="field.element.nativeElement"
  (keydown)="onKeyDown($event)"
  (closed)="onPopoverClosed()"
>
  <ng-template #lazy>
    <div [ngClass]="theme.class('popover-content')">
      @if (filter()) {
        <ngn-input-field [ngClass]="theme.class('filter')">
          <input
            ngnInput
            [ngModel]="filterTextInternal()"
            (ngModelChange)="filterTextInternal.set($event)"
          />
          <ngn-icon defaultIcon="fa-solid fa-magnifying-glass" [icon]="filterIcon()" />
          @if (filterIsExecuting()) {
            <!-- TODO: replace with spinner -->
            <ngn-icon defaultIcon="fa-solid fa-spinner fa-spin" />
          }
        </ngn-input-field>
      }
      <ngn-list-box
        [ngClass]="theme.class('list-box')"
        style="height: 100%; min-height: 0"
        [highlightable]="false"
        [selectable]="true"
        [items]="filteredOptions()"
        [itemHeight]="itemHeight()"
        [virtual]="virtual()"
        [templateItem]="itemTemplate()"
        [templateGroup]="groupTemplate()"
        [fields]="{
          groupItems: 'items',
          value: 'value',
          label: 'label',
          testId: 'testId',
        }"
        [ngModel]="selectedItem()?.value"
        (ngModelChange)="onSelect($event)"
      />
    </div>
  </ng-template>
</ngn-popover>

<ng-template #defaultItemTemplate [ngnTemplate]="templateTypes.item" let-item>
  <span [attr.data-testid]="item?.testId">{{ item?.label }}&ZeroWidthSpace;</span>
</ng-template>

<ng-template #defaultGroupTemplate [ngnTemplate]="templateTypes.item" let-group>
  <span [attr.data-testid]="group?.testId">{{ group?.label }}&ZeroWidthSpace;</span>
</ng-template>

<ng-template #defaultSelectedItemTemplate [ngnTemplate]="templateTypes.item" let-item>
  <span [attr.data-testid]="item?.testId">{{ item?.label }}&ZeroWidthSpace;</span>
</ng-template>
