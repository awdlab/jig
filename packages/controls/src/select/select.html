<ngn-input-field
  [ngClass]="
    theme.classes({
      input: true,
      'input-editable': editable(),
    })
  "
  (click)="open()"
  (keydown)="onKeyDown($event)"
  #field
  [label]="label()"
  [inputId]="inputId()"
  [invalid]="invalid()"
  [tabindex]="tabindex()"
>
  @if (editable()) {
    <ng-content select="[ngnInput]">
      <input
        ngnInput
        autocomplete="list"
        [aria-expanded]="popover.isOpen()"
        aria-haspopup="listbox"
        [attr.aria-controls]="inputId() + '_listbox'"
        [value]="valueStr() || ''"
        (valueChange)="onEditableChange($event)"
      />
    </ng-content>
  } @else {
    <div
      role="combobox"
      [ngClass]="theme.class('combobox')"
      [aria-expanded]="popover.isOpen()"
      aria-haspopup="listbox"
      [attr.aria-controls]="inputId() + '_listbox'"
    >
      @if (multiple()) {
        <ng-container
          [ngTemplateOutlet]="selectedItemsTemplate()"
          [ngTemplateOutletContext]="{
            $implicit: selectedItems(),
          }"
        />
      } @else {
        <ng-container
          [ngTemplateOutlet]="selectedItemTemplate()"
          [ngTemplateOutletContext]="{
            $implicit: selectedItems()[0],
          }"
        />
      }
    </div>
  }
  <ngn-icon [ngClass]="theme.class('icon')" [icon]="dropdownIcon()" defaultIcon="chevron_down" />
</ngn-input-field>
<ngn-popover
  #popover
  [options]="appliedPopoverOptions()"
  [anchor]="field.element.nativeElement"
  (keydown)="onKeyDown($event)"
  (closed)="onPopoverClosed()"
  [id]="inputId() + '_popover'"
  [hasShrinkableContent]="true"
>
  <ng-template #lazy>
    <div [ngClass]="theme.class('popover-content')">
      @if (filter()) {
        <ngn-input-field [ngClass]="theme.class('filter')">
          <input
            ngnInput
            [value]="filterTextInternal()"
            (valueChange)="filterTextInternal.set($event)"
          />
          <ngn-icon
            [ngClass]="theme.class('filter-icon')"
            defaultIcon="magnifying_glass"
            [icon]="filterIcon()"
          />
        </ngn-input-field>
      }
      <ngn-list-box
        [ngClass]="
          theme.classes({
            'list-box': true,
          })
        "
        style="height: 100%; min-height: 0"
        [highlightable]="false"
        [selectable]="true"
        [filter]="appliedFilter()"
        [filterText]="filterTextInternal()"
        [items]="formattedOptions()"
        [itemHeight]="itemHeight()"
        [virtual]="virtual()"
        [templateItem]="itemTemplate()"
        [templateGroup]="groupTemplate()"
        [multiple]="multiple()"
        [value]="multiple() ? selectedItemsValues() : selectedItemsValues()[0]"
        [scrollToSelectedItemOnInit]="scrollToSelectedItemOnOpen()"
        (valueChange)="onSelect($event)"
        [inputId]="inputId() + '_listbox'"
        [templateEmpty]="noItemsTemplate()"
      />
    </div>
  </ng-template>
</ngn-popover>

<ng-template #defaultItemTemplate [ngnTemplate]="templateTypes.item" let-item>
  <span [attr.data-testid]="item?.testId">{{ item?.label }}</span>
</ng-template>

<ng-template #defaultGroupTemplate [ngnTemplate]="templateTypes.item" let-group>
  <span [attr.data-testid]="group?.testId">{{ group?.label }}</span>
</ng-template>

<ng-template #defaultSelectedItemTemplate [ngnTemplate]="templateTypes.item" let-item>
  <span [attr.data-testid]="item?.testId">{{ item?.label ?? '&ZeroWidthSpace;' }}</span>
</ng-template>

<ng-template #defaultSelectedItemsTemplate [ngnTemplate]="templateTypes.selectedItems" let-items>
  <ngn-item-view
    #itemView
    [items]="items"
    [idField]="'value'"
    [separator]="true"
    style="margin-right: 8px"
  >
    <ng-template #item let-item [ngnTemplate]="itemView.templateTypes.item">
      <ng-container
        *ngTemplateOutlet="selectedItemTemplate(); context: { $implicit: item }"
      ></ng-container>
    </ng-template>
  </ngn-item-view>
  @if (items.length < 1) {
    &ZeroWidthSpace;
  }
</ng-template>
