<ngn-form-field
  (click)="popover.open()"
  ngnElementRef
  #field="ngnElementRef"
  [label]="label()"
  [inputId]="inputId()"
>
  <ng-template
    [ngTemplateOutlet]="itemTemplate()"
    [ngTemplateOutletContext]="{
      $implicit: {
        data: selectedItem(),
        value: selectedItem()?.[fieldValue()],
        label: selectedItem()?.[fieldLabel()],
        testId: fieldTestId() ? selectedItem()?.[fieldTestId()!] : undefined,
      },
    }"
  ></ng-template>
</ngn-form-field>
<ngn-popover #popover [options]="popoverOptions()" [anchor]="field.nativeElement">
  @if (filter()) {
    <ngn-form-field>
      <ngn-text-field
        [ngModel]="filterTextInternal()"
        (ngModelChange)="filterTextInternal.set($event)"
      />
      Filter
    </ngn-form-field>
  }
  <ul>
    @for (item of filteredOptions(); track item[fieldValue()]) {
      <!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -->
      <li (click)="onSelect(item[fieldValue()])">
        <ng-template
          [ngTemplateOutlet]="itemTemplate()"
          [ngTemplateOutletContext]="{
            $implicit: {
              data: item,
              value: item?.[fieldValue()],
              label: item?.[fieldLabel()],
              testId: fieldTestId() ? item?.[fieldTestId()!] : undefined,
            },
          }"
        ></ng-template>
      </li>
    }
  </ul>
</ngn-popover>

<ng-template #defaultItemTemplate [ngnTemplate]="templateTypes.item" let-item>
  <span [attr.data-testid]="item.testId">{{ item.label }}&ZeroWidthSpace;</span>
</ng-template>
