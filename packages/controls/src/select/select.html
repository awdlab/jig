<ngn-form-field
  (click)="popover.open()"
  (keydown)="onKeyDown($event)"
  ngnElementRef
  #field="ngnElementRef"
  [label]="label()"
  [inputId]="inputId()"
>
  <div class="ngn-select-trigger" tabindex="0">
    <ng-template
      [ngTemplateOutlet]="selectedItemTemplate()"
      [ngTemplateOutletContext]="{
        $implicit: selectedItem(),
      }"
    ></ng-template>
  </div>
</ngn-form-field>
<ngn-popover
  class="ngn-select-popover"
  (keydown)="onKeyDown($event)"
  #popover
  [options]="popoverOptions()"
  [anchor]="field.nativeElement"
  (closed)="onPopoverClosed()"
>
  @if (filter()) {
    <ngn-form-field>
      <ngn-text-field
        [ngModel]="filterTextInternal()"
        (ngModelChange)="filterTextInternal.set($event)"
      />
      <ngn-icon defaultIcon="fa-solid fa-magnifying-glass" [icon]="filterIcon()" />
      @if (filterIsExecuting()) {
        <!-- TODO: replace with spinner -->
        <ngn-icon defaultIcon="fa-solid fa-spinner fa-spin" />
      }
    </ngn-form-field>
  }
  <div class="ngn-select-options">
    <ng-container
      *ngTemplateOutlet="optionsTemplate; context: { $implicit: filteredOptions() }"
    ></ng-container>
  </div>
</ngn-popover>

<ng-template #optionsTemplate [ngnTemplate]="templateTypesInternal.options" let-options>
  <ul>
    @for (option of options; track option.value) {
      <!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -->
      <li
        [class.highlighted]="option.value === currentHighlightedValue()"
        [class.selected]="option.value === value()"
        (click)="!option.items && onSelect(option.value)"
      >
        <ng-template
          [ngTemplateOutlet]="option.items ? groupTemplate() : itemTemplate()"
          [ngTemplateOutletContext]="{
            $implicit: option,
          }"
        ></ng-template>
      </li>

      @if (option.items; as items) {
        <ng-container
          *ngTemplateOutlet="optionsTemplate; context: { $implicit: items }"
        ></ng-container>
      }
    }
  </ul>
</ng-template>

<ng-template #defaultItemTemplate [ngnTemplate]="templateTypes.item" let-item>
  <span [attr.data-testid]="item?.testId">{{ item?.label }}&ZeroWidthSpace;</span>
</ng-template>

<ng-template #defaultGroupTemplate [ngnTemplate]="templateTypes.group" let-group>
  <span [attr.data-testid]="group?.testId">{{ group?.label }}&ZeroWidthSpace;</span>
</ng-template>

<ng-template #defaultSelectedItemTemplate [ngnTemplate]="templateTypes.item" let-item>
  <span [attr.data-testid]="item?.testId">{{ item?.label }}&ZeroWidthSpace;</span>
</ng-template>
